      const saved = G.rot;
      for (let n = 1; n <= 5; n++) {
        G.rot = saved - n * 7 + Math.sin(now * 0.4 + n) * 3;
        gatePath(L.R * Math.pow(1.55, n));
        g.strokeStyle = rgba(PAPER, 0.05 - n * 0.006); g.stroke();
      }
      G.rot = saved;
      if (beat >= 0 && !kit.reduceMotion) {
        const f = beat - Math.floor(beat);
        gatePath(L.R * (1 + f * 2.2));
        g.strokeStyle = rgba(hue, 0.28 * (1 - f)); g.lineWidth = 2; g.stroke();
      }
    }
    function drawNotes(now) {
      const tMax = now + VIEW * 1.02, tMin = now - 0.12;

        if (n.chord) chords.push({ t: n.t, x: (p[0] + p[2]) / 2, y: (p[1] + p[3]) / 2, a: Math.max(0, fade) });

        g.strokeStyle = rgba(col, 0.3); g.lineWidth = 16;
        g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(p[2], p[3]); g.stroke();
        g.globalCompositeOperation = 'source-over';
        g.strokeStyle = rgba(col, 1); g.lineWidth = 8;
        g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(p[2], p[3]); g.stroke();
        g.strokeStyle = rgba(PAPER, 0.85); g.lineWidth = 2;
        g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(p[2], p[3]); g.stroke();

    function drawGate(now) {
      const R = radiusAt(0);
      const body = g.createRadialGradient(L.cx, L.cy, 0, L.cx, L.cy, R);

      g.lineCap = 'round';
      for (let i = 0; i < 6; i++) {
        const span = spanOf(G.ang, i);
        if (span < 1) continue;
        const col = EDGES[i].rgb;
        const down = S.pressed[i] || S.autoHold[i] > now;
        const open = Math.min(1, span / 60);
        const p = edgePts(i, R, 0.04);

    }
    function drawLegend(now) {
      const gap = 6, cw = Math.min(60, (W - 32 - gap * 5) / 6), ch = 32;
      const total = cw * 6 + gap * 5;
      const x0 = Math.min(W - total - 16, Math.max(16, L.cx - total / 2)), y0 = H - ch - Math.max(14, H * 0.03);

    }
    const GRADE_COLOR = { perfect: PAPER, great: EDGES[2].rgb, good: EDGES[4].rgb, miss: MUTED };
    function drawCentre(now) {
      const R = L.R;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      const popup = S.popup && now - S.popup.t <= 0.5 ? S.popup : null;
      if (S.combo >= 5) {

        g.font = `${Math.round(R * 0.4)}px "Dela Gothic One", sans-serif`;
        g.fillText(String(S.combo), L.cx, L.cy - R * 0.08);
        if (!popup) {
          g.font = '700 10px "Zen Kaku Gothic New", sans-serif';
          g.fillStyle = rgba(PAPER, 0.35);

      }

    return {
      id: 'kiriko', name: 'KIRIKO', kind: '変形する多角形', kana: '切子ゲート ・ 変形する多角形',
      blurb: '回る多角形の辺がレーン。曲に合わせて三角から六角まで形が変わり、使うキーも増減する。',
      lede: '中央の多角形の<strong>辺がそれぞれレーン</strong>です。ノーツは外側から辺に向かって迫ってきます。多角形は回り続け、曲の展開に合わせて辺の数が 三角 F J K → 四角 D F J K → 五角 D F J K L → 六角 全部 と変わります。',
      keys: EDGES.map((e) => ({ label: e.label, name: e.name, color: e.color })),
      touchHint: 'スマホは辺の方向をタップ',
      meta: 'BPM 140 ・ 44小節 ・ 約1分15秒 ・ ノーツは「着弾するときの形」の辺として飛んでくるので、形が変わる前から次の形が見えます。',
      theme, comboOwn: true, attractFromBar: 16,
      bpm: BPM, bars: 44, sections: SECTIONS, chords: CHORDS, chart: CHART,
      laneCodes: [['KeyS'], ['KeyD'], ['KeyF'], ['KeyJ'], ['KeyK'], ['KeyL']],
      touchLane(x, y) {
        let a = Math.atan2(y - L.cy, x - L.cx) / DEG - G.rot;
        a = ((a - G.ang[0]) % 360 + 360) % 360 + G.ang[0];
        for (let i = 0; i < 6; i++) {
          const a0 = G.ang[i], a1 = i === 5 ? G.ang[0] + 360 : G.ang[i + 1];

        }
        return -1;
      },
      hudExtra: () => `${G.ang.reduce((n, _, i) => n + (spanOf(G.ang, i) >= ACTIVE_SPAN ? 1 : 0), 0)}辺`,
      progressColor: (beat) => rgba(EDGES[SECTIONS[kit.secIndex(SECTIONS, Math.max(0, Math.floor(beat / 4)))].hue].rgb, 0.9),
      song: {
        bass: { wave: 'square', shift: -12, subShift: -24, sub: 0.7, q: 6, open: 1500, close: 240 },
        pad: { wave: 'sawtooth', cutoff: 1300, level: 0.045, detune: 8, attack: 0.3 },
        delay: { beats: 0.75, feedback: 0.3, mix: 0.25 }, leadLevel: 0.55, leadSend: 0.45, padBus: 0.85,
        leadMidi: (n) => CHORDS[Math.floor(n.beat / 4) % 4].lead[n.lane],
        // Glassy bell: a sine with an inharmonic partial, like a struck cut-glass bowl.
        lead(A, at, midi, dur) {

          const g2 = ac.createGain(); g2.gain.value = 0.18;
          const o3 = ac.createOscillator(); o3.type = 'sine'; o3.frequency.value = f0 * 2.76;

        arrange(add, bar, b0, ch, name) {

          } else if (name === 'BUILD') {

    // Walls in clockwise order: 0 top, 1 right, 2 bottom, 3 left.

      { key: 'W', color: '#4cc9ff' },
      { key: 'D', color: '#ffa24c' },
      { key: 'S', color: '#7be07b' },
      { key: 'A', color: '#ff6fa8' },

    const SECTIONS = [
      { bar: 0, name: 'INTRO', hue: 0 }, { bar: 4, name: 'VERSE', hue: 2 }, { bar: 12, name: 'BUILD', hue: 1 },
      { bar: 20, name: 'CHORUS', hue: 3 }, { bar: 28, name: 'BREAK', hue: 0 }, { bar: 32, name: 'CHORUS II', hue: 3 },
      { bar: 40, name: 'OUTRO', hue: 2 },
    ];

    // U R D L = the ball strikes that wall. Lowercase starts a hold: the ball slides along the
    // wall while '-' follows. Hits in a track belong to the same ball until a gap of over 3 beats.
    const TRACKS = [
      { at: 0, seq: 'U.R.D.L.|U.R.D.L.|U...D...|R...L...' },
      { at: 4, seq: 'L...R...|L...R...|U...D...|U...D...|L...U...|R...D...|L...R...|u-------' },
      { at: 4, seq: '..U...D.|..U...D.|..L...R.|..L...R.|..D...L.|..U...R.|..D...U.' },
      { at: 12, seq: 'U.D.U.D.|L.R.L.R.|U.R.D.L.|U.R.D.L.|U...D...|L...R...|U.L.D.R.|U.......' },
      { at: 12, seq: '.L...R..|.U...D..|.L...R..|.U...D..|.L.R.L.R|.U.D.U.D|.L.U.R.D' },
      { at: 19, seq: '..L.R.D.' },
      { at: 20, seq: 'U.R.D.L.|U.R.D.L.|U.D.U.D.|l---..R.|U.R.D.L.|U.R.D.L.|U.D.U.D.|L.R.L.R.' },
      { at: 20, seq: '...D...L|...U...R|...L...R|....D.U.|...D...L|...U...R|...L...R|...U...D' },
      { at: 28, seq: 'u---..d-|--..l---|..r---..|U...D...' },
      { at: 32, seq: 'U.R.D.L.|U.D.L.R.|U.R.D.L.|r---..L.|U.L.D.R.|U.D.L.R.|U.R.D.L.|U.D.U.D.' },
      { at: 32, seq: '...L...D|...R...U|...L...D|....U.D.|...R...L|...D...U|...L...R|...L...R' },

      { pad: [52, 55, 60], bass: 36, lead: [76, 72, 64, 67] },
      { pad: [55, 59, 62], bass: 43, lead: [74, 71, 67, 62] },
      { pad: [54, 57, 62], bass: 38, lead: [74, 69, 66, 62] },

    // ----- balls and notes -----
    const rnd = kit.mulberry32(20261027);

        hits.push({ beat: tr.at * 4 + i / 2, wall: w, beats: len / 2 });
      }

      for (const h of hits) {

        else if ((prev.wall + 2) % 4 === h.wall ? gap < 1 : gap < 0.5) console.warn(`kagami: beat ${h.beat}: too fast to cross from wall ${prev.wall}`);
        ball.hits.push(h);
      }
    }

      ball.spawn = [0.5 + (rnd() - 0.5) * 0.3, 0.5 + (rnd() - 0.5) * 0.3];
      for (const h of ball.hits) {
        const u0 = 0.18 + rnd() * 0.64;
        const t = h.beat * SPB, dur = h.beats * SPB;
        const note = { beat: h.beat, t, lane: h.wall, dur, ball };
        CHART.push(note);
        ball.frames.push({ t, p: wallPoint(h.wall, u0), note });
        if (dur > 0) {

        }
      }
      ball.first = ball.frames[0].t;
      ball.last = ball.frames[ball.frames.length - 1].t;
    }
    kit.sortChart(CHART);

    let W = 0, H = 0, VIEW = 1.4;
    function ballAt(ball, t) {
      const F = ball.frames;
      if (t < ball.first) {
        const u = 1 - (ball.first - t) / VIEW;
        if (u < 0) return null;
        return [ball.spawn[0] + (F[0].p[0] - ball.spawn[0]) * u, ball.spawn[1] + (F[0].p[1] - ball.spawn[1]) * u];
      }
      if (t >= ball.last) return F[F.length - 1].p;

      while (i < F.length - 2 && F[i + 1].t <= t) i++;
      const a = F[i], b = F[i + 1], k = (t - a.t) / (b.t - a.t);

    }
    function nextStrike(ball, t) {
      for (let i = 0; i < ball.frames.length; i++) if (ball.frames[i].note && ball.frames[i].t > t) return i;
      return -1;
    }

    // ----- layout -----
    const R = { x: 0, y: 0, w: 1, h: 1 }, RG = { x: 0, y: 0, w: 1, h: 1 };
    const px = (p) => [R.x + p[0] * R.w, R.y + p[1] * R.h];
    const ballR = () => Math.max(7, Math.min(R.w, R.h) * 0.024);
    const INWARD = [[0, 1], [-1, 0], [0, -1], [1, 0]];
    const wallLine = (w) => (w === 0 ? [R.x, R.y, R.x + R.w, R.y] : w === 1 ? [R.x + R.w, R.y, R.x + R.w, R.y + R.h]
      : w === 2 ? [R.x, R.y + R.h, R.x + R.w, R.y + R.h] : [R.x, R.y, R.x, R.y + R.h]);

    // ----- effects -----
    const particles = [], rings = [];
    function burst(x, y, wall, col, power) {
      rings.push({ x, y, wall, col, life: 0, max: 0.45 });
      const n = kit.reduceMotion ? 4 : Math.round(18 * power);
      const base = Math.atan2(INWARD[wall][1], INWARD[wall][0]);
      for (let i = 0; i < n; i++) {
        const a = base + (Math.random() - 0.5) * 2.6, v = (120 + Math.random() * 300) * power;
        particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 0.3 + Math.random() * 0.4, col, size: 1.4 + Math.random() * 2.4 });
      }
    }
    function drawEffects(dt) {
      g.globalCompositeOperation = 'lighter';
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i]; r.life += dt;
        if (r.life > r.max) { rings.splice(i, 1); continue; }
        const u = r.life / r.max;
        const base = Math.atan2(INWARD[r.wall][1], INWARD[r.wall][0]);
        g.strokeStyle = rgba(r.col, 0.85 * (1 - u)); g.lineWidth = 3 * (1 - u) + 1;
        g.beginPath(); g.arc(r.x, r.y, ballR() * (1.5 + u * 5), base - Math.PI / 2, base + Math.PI / 2); g.stroke();
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.life += dt;
        if (p.life > p.max) { particles.splice(i, 1); continue; }
        p.vx *= 1 - dt * 2.2; p.vy *= 1 - dt * 2.2;
        p.x += p.vx * dt; p.y += p.vy * dt;
        g.fillStyle = rgba(p.col, 1 - p.life / p.max);
        g.beginPath(); g.arc(p.x, p.y, p.size, 0, Math.PI * 2); g.fill();
      }
      g.globalCompositeOperation = 'source-over';
    }

    function drawBackground(beat, pulse) {
      const bg = g.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, rgba(INK, 1)); bg.addColorStop(1, rgba(INK2, 1));
      g.fillStyle = bg; g.fillRect(0, 0, W, H);
      const hue = WALLS[SECTIONS[kit.secIndex(SECTIONS, Math.floor(beat / 4))].hue].rgb;
      const cx = R.x + R.w / 2, cy = R.y + R.h / 2;
      const glow = g.createRadialGradient(cx, cy, 0, cx, cy, Math.max(R.w, R.h) * 0.8);
      glow.addColorStop(0, rgba(hue, 0.1 + 0.08 * pulse)); glow.addColorStop(1, rgba(hue, 0));
      g.fillStyle = glow; g.fillRect(0, 0, W, H);
      g.strokeStyle = rgba(PAPER, 0.04); g.lineWidth = 1;
      g.beginPath();
      for (let i = 1; i < 8; i++) { const x = R.x + (R.w * i) / 8; g.moveTo(x, R.y); g.lineTo(x, R.y + R.h); }
      for (let i = 1; i < 8; i++) { const y = R.y + (R.h * i) / 8; g.moveTo(R.x, y); g.lineTo(R.x + R.w, y); }
      g.stroke();
    }
    function drawKeyCap(w, down) {
      const col = WALLS[w].rgb, off = 26;
      const [x0, y0, x1, y1] = wallLine(w);
      const mx = (x0 + x1) / 2 - INWARD[w][0] * off, my = (y0 + y1) / 2 - INWARD[w][1] * off;
      const ang = Math.atan2(-INWARD[w][1], -INWARD[w][0]);
      g.save();
      g.translate(mx, my);
      g.fillStyle = rgba(col, down ? 1 : 0.85);
      g.save(); g.rotate(ang);
      g.beginPath(); g.moveTo(9, 0); g.lineTo(-5, -8); g.lineTo(-5, 8); g.closePath(); g.fill();
      g.restore();
      g.fillStyle = rgba(PAPER, 0.9);
      g.font = '15px "Dela Gothic One", sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      const side = w % 2 === 0 ? [22, 1] : [0, 22];
      g.fillText(WALLS[w].key, side[0], side[1]);
      g.restore();
    }
    function drawWalls(now, pulse) {
      g.lineCap = 'round';
      for (let w = 0; w < 4; w++) {
        const [x0, y0, x1, y1] = wallLine(w), col = WALLS[w].rgb;
        const down = S.pressed[w] || S.autoHold[w] > now;
        g.globalCompositeOperation = 'lighter';
        g.strokeStyle = rgba(col, 0.12 + 0.1 * pulse + 0.35 * S.flash[w] + (down ? 0.25 : 0)); g.lineWidth = 18;
        g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
        g.globalCompositeOperation = 'source-over';
        g.strokeStyle = rgba(col, down ? 1 : 0.85); g.lineWidth = down ? 6 : 4;
        g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
        drawKeyCap(w, down);
      }
    }
    function drawBalls(now) {
      const r = ballR();
      const chords = [];
      const clampIn = ([x, y]) => [Math.min(R.x + R.w - r, Math.max(R.x + r, x)), Math.min(R.y + R.h - r, Math.max(R.y + r, y))];
      for (const ball of BALLS) {
        if (now < ball.first - VIEW || now > ball.last + 1.2) continue;
        const F = ball.frames;
        // fading light paths the ball has already drawn
        g.lineCap = 'round';
        for (let i = 0; i < F.length - 1; i++) {
          const age = now - F[i + 1].t;
          if (age < 0 || age > 1.1) continue;
          const a = px(F[i].p), b = px(F[i + 1].p);
          const col = WALLS[(F[i + 1].note || F[i + 1].tail).lane].rgb;
          g.strokeStyle = rgba(col, 0.3 * (1 - age / 1.1)); g.lineWidth = 2;
          g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
        }
        if (now > ball.last + 0.35) continue;
        const pos = ballAt(ball, now);
        if (!pos) continue;
        const ni = nextStrike(ball, now);
        const target = ni >= 0 ? F[ni] : null;
        const holding = F.some((f) => f.tail && f.t > now && kit.holding(kit.runOf(f.tail)));
        // while sliding along a wall the ball wears that wall's colour, otherwise the colour of its next wall
        const slide = F.find((f) => f.note && f.note.dur > 0 && f.t <= now && now < f.t + f.note.dur);
        const lastF = F[F.length - 1];
        const col = WALLS[slide ? slide.note.lane : target ? target.note.lane : (lastF.note || lastF.tail).lane].rgb;
        const appear = Math.min(1, (now - (ball.first - VIEW)) / 0.25);
        const fadeOut = now > ball.last ? 1 - (now - ball.last) / 0.35 : 1;
        let prevMiss = false;
        for (let i = F.length - 1; i >= 0; i--) if (F[i].note && F[i].t <= now) { prevMiss = kit.runOf(F[i].note).head === 'miss'; break; }
        const alpha = appear * fadeOut * (prevMiss ? 0.45 : 1);

        // where it will strike next, and the bounce after that
        if (target && target.t - now < VIEW) {
          const tp = px(target.p), bp = clampIn(px(pos));
          if (target.note.chord) chords.push({ t: target.t, x: tp[0], y: tp[1], a: alpha });
          const k = Math.max(0, Math.min(1, (target.t - now) / (VIEW * 0.75)));
          g.setLineDash([4, 6]);
          g.strokeStyle = rgba(col, 0.28 * alpha); g.lineWidth = 1.5;
          g.beginPath(); g.moveTo(bp[0], bp[1]); g.lineTo(tp[0], tp[1]); g.stroke();
          const after = F.slice(ni + 1).find((f) => f.note);
          if (after && after.t - now < VIEW * 1.6) {
            const ap = px(after.p);
            g.strokeStyle = rgba(WALLS[after.note.lane].rgb, 0.12 * alpha);
            g.beginPath(); g.moveTo(tp[0], tp[1]); g.lineTo(ap[0], ap[1]); g.stroke();
          }
          g.setLineDash([]);
          const w = target.note.lane;
          const base = Math.atan2(INWARD[w][1], INWARD[w][0]);
          g.strokeStyle = rgba(col, (0.25 + 0.75 * (1 - k)) * alpha); g.lineWidth = 2.5;
          g.beginPath(); g.arc(tp[0], tp[1], r * (1.3 + 4 * k), base - Math.PI / 2, base + Math.PI / 2); g.stroke();
          g.fillStyle = rgba(col, 0.9 * alpha);
          g.beginPath(); g.arc(tp[0], tp[1], 3, 0, Math.PI * 2); g.fill();
        }

        const [bx, by] = clampIn(px(pos));
        g.globalAlpha = alpha;
        g.globalCompositeOperation = 'lighter';
        for (let k = 1; k <= 10; k++) {
          const pp = ballAt(ball, now - k * 0.018);
          if (!pp) break;
          const [tx, ty] = clampIn(px(pp));
          g.fillStyle = rgba(col, 0.16 * (1 - k / 11));
          g.beginPath(); g.arc(tx, ty, r * (1 - k / 14), 0, Math.PI * 2); g.fill();
        }
        g.fillStyle = rgba(col, holding ? 0.4 : 0.2);
        g.beginPath(); g.arc(bx, by, r * (holding ? 2.6 : 2), 0, Math.PI * 2); g.fill();
        // mirror images just beyond the nearest walls
        for (let w = 0; w < 4; w++) {
          const d = w === 0 ? by - R.y : w === 1 ? R.x + R.w - bx : w === 2 ? R.y + R.h - by : bx - R.x;
          const lim = Math.min(R.w, R.h) * 0.25;
          if (d > lim) continue;
          const mx = w === 1 ? 2 * (R.x + R.w) - bx : w === 3 ? 2 * R.x - bx : bx;
          const my = w === 0 ? 2 * R.y - by : w === 2 ? 2 * (R.y + R.h) - by : by;
          g.strokeStyle = rgba(col, 0.45 * (1 - d / lim)); g.lineWidth = 1.5;
          g.beginPath(); g.arc(mx, my, r * 0.8, 0, Math.PI * 2); g.stroke();
        }
        g.globalCompositeOperation = 'source-over';
        g.fillStyle = rgba(col, 1);
        g.beginPath(); g.arc(bx, by, r, 0, Math.PI * 2); g.fill();
        g.fillStyle = rgba(PAPER, 0.95);
        g.beginPath(); g.arc(bx - r * 0.25, by - r * 0.25, r * 0.38, 0, Math.PI * 2); g.fill();
        g.globalAlpha = 1;
      }
      // two balls striking at the same moment: join their target marks
      g.setLineDash([6, 6]);
      kit.chordLines(chords, PAPER);
      g.setLineDash([]);
    }
    const GRADE_COLOR = { perfect: PAPER, great: WALLS[1].rgb, good: WALLS[0].rgb, miss: MUTED };
    function drawCentre(now) {
      const cx = R.x + R.w / 2, cy = R.y + R.h / 2, u = Math.min(R.w, R.h);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      if (S.combo >= 5) {
        g.fillStyle = rgba(PAPER, 0.12);
        g.font = `${Math.round(u * 0.2)}px "Dela Gothic One", sans-serif`;
        g.fillText(String(S.combo), cx, cy - u * 0.03);
        g.font = '700 11px "Zen Kaku Gothic New", sans-serif';
        g.fillStyle = rgba(PAPER, 0.28);
        g.fillText('C O M B O', cx, cy + u * 0.1);
      }
      if (S.popup && now - S.popup.t <= 0.5) {
        const age = now - S.popup.t;
        const k = 1 + 0.25 * Math.max(0, 1 - age * 8);
        g.save();
        g.translate(cx, cy + u * 0.18); g.scale(k, k);
        g.globalAlpha = Math.min(1, (0.5 - age) * 5);
        g.font = `${Math.round(Math.min(22, u * 0.06))}px "Dela Gothic One", sans-serif`;
        g.fillStyle = rgba(GRADE_COLOR[S.popup.grade], 1);
        g.fillText(S.popup.grade.toUpperCase(), 0, 0);
        g.restore();
      }
    }

    return {
      id: 'kagami', name: 'KAGAMI', kind: '四辺反射', kana: '鏡の間 ・ 四辺反射',
      blurb: '四方の壁がすべて判定ライン。跳ね回る光の玉が壁に当たる瞬間に、その壁のキーを押す。',
      lede: '四方の壁がすべて判定ラインです。光の玉が跳ね回り、<strong>壁に当たる瞬間</strong>にその壁のキーを押します。玉の色は、次に当たる壁の色です。長押しでは玉が壁を滑ります。',
      keys: [
        { label: '↑ W', name: '上の壁', color: WALLS[0].color },
        { label: '← A', name: '左の壁', color: WALLS[3].color },
        { label: '↓ S', name: '下の壁', color: WALLS[2].color },
        { label: '→ D', name: '右の壁', color: WALLS[1].color },
      ],
      touchHint: '矢印と WASD は同じ ・ スマホは壁の側をタップ',
      meta: 'BPM 124 ・ 44小節 ・ 約1分25秒 ・ 当たる地点の半円が縮み、その次の跳ね返り先も薄く見えます。',
      theme, comboOwn: true, attractFromBar: 20,
      bpm: BPM, bars: 44, sections: SECTIONS, chords: CHORDS, chart: CHART,
      laneCodes: [['ArrowUp', 'KeyW'], ['ArrowRight', 'KeyD'], ['ArrowDown', 'KeyS'], ['ArrowLeft', 'KeyA']],
      // the box's diagonals split the screen into four wedges, one per wall
      touchLane(x, y) {
        const nx = (x - (R.x + R.w / 2)) / (R.w / 2), ny = (y - (R.y + R.h / 2)) / (R.h / 2);
        return Math.abs(ny) > Math.abs(nx) ? (ny < 0 ? 0 : 2) : (nx > 0 ? 1 : 3);
      },
      progressColor: (beat) => rgba(WALLS[SECTIONS[kit.secIndex(SECTIONS, Math.max(0, Math.floor(beat / 4)))].hue].rgb, 0.9),
      song: {
        bass: { wave: 'sawtooth', subShift: 0, q: 7, open: 1600, close: 260 },
        pad: { wave: 'sawtooth', cutoff: 1200, level: 0.05, attack: 0.3 },
        delay: { beats: 0.75, feedback: 0.28, mix: 0.22 }, leadLevel: 0.6, leadSend: 0.3, padBus: 0.85,
        leadMidi: (n) => CHORDS[Math.floor(n.beat / 4) % 4].lead[n.lane],
        // Marimba-like strike: a sine with a quickly fading fourth harmonic.
        lead(A, at, midi, dur) {
          const { ac } = A, f0 = A.mtof(midi);
          const gn = ac.createGain();
          gn.gain.setValueAtTime(0.0001, at); gn.gain.exponentialRampToValueAtTime(0.32, at + 0.003);
          if (dur < 0.3) gn.gain.exponentialRampToValueAtTime(0.0001, at + 0.45);
          else { gn.gain.exponentialRampToValueAtTime(0.12, at + 0.15); gn.gain.setValueAtTime(0.12, at + dur); gn.gain.exponentialRampToValueAtTime(0.0001, at + dur + 0.3); }
          gn.connect(A.bus.lead);
          const end = at + Math.max(0.5, dur + 0.35);
          const o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = f0;
          const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = f0 * 4;
          const g2 = A.decayGain(at, 0.4, 0.001, 0.07);
          const o3 = ac.createOscillator(); o3.type = 'triangle'; o3.frequency.value = f0;
          const g3 = ac.createGain(); g3.gain.value = 0.25;
          o1.connect(gn); o2.connect(g2).connect(gn); o3.connect(g3).connect(gn);
          if (dur >= 0.3) {
            // a hold slides along the wall: add a soft tremolo so it sings
            const lfo = ac.createOscillator(); lfo.frequency.value = 8;
            const lg = ac.createGain(); lg.gain.value = 0.04;
            lfo.connect(lg).connect(gn.gain); lfo.start(at); lfo.stop(end);
          }
          for (const o of [o1, o2, o3]) { o.start(at); o.stop(end); }
        },
        arrange(add, bar, b0, ch, name) {
          if (name === 'INTRO') {
            if (bar >= 2) for (let i = 0; i < 4; i++) add(b0 + i + 0.5, 'rim');
          } else if (name === 'VERSE') {
            for (let i = 0; i < 4; i++) { add(b0 + i, 'kick'); add(b0 + i + 0.5, 'hat', false); }
            add(b0 + 1.5, 'rim'); add(b0 + 3.75, 'rim');
            for (const s of [0, 0.75, 1.5, 2, 2.75, 3.5]) add(b0 + s, 'bass', ch.bass, SPB * 0.4);
          } else if (name === 'BUILD') {
            for (let i = 0; i < 4; i++) add(b0 + i, 'kick');
            for (let i = 0; i < 16; i++) add(b0 + i / 4, 'hat', false);
            for (const s of [0, 0.75, 1.5, 2, 2.75, 3.5]) add(b0 + s, 'bass', ch.bass, SPB * 0.4);
            if (bar === 19) for (let i = 8; i < 16; i++) add(b0 + i / 4, 'snare');
            else { add(b0 + 1, 'snare'); add(b0 + 3, 'snare'); }
          } else if (name === 'CHORUS' || name === 'CHORUS II') {
            if (bar % 4 === 0) add(b0, 'crash');
            for (let i = 0; i < 4; i++) {
              add(b0 + i, 'kick');
              add(b0 + i + 0.5, 'hat', true);
              add(b0 + i + 0.25, 'hat', false); add(b0 + i + 0.75, 'hat', false);
            }
            for (const s of [0, 0.5, 0.75, 1.5, 2, 2.5, 2.75, 3.5]) add(b0 + s, 'bass', ch.bass + (s % 1 === 0.5 ? 12 : 0), SPB * 0.35);
            add(b0 + 1, 'snare'); add(b0 + 3, 'snare');
          } else if (name === 'BREAK') {
            add(b0, 'bass', ch.bass, SPB * 3.5);
            for (let i = 0; i < 4; i++) add(b0 + i + 0.5, 'rim');
            if (bar === 31) { for (let i = 0; i < 4; i++) add(b0 + i, 'kick'); for (let i = 8; i < 16; i++) add(b0 + i / 4, 'snare'); }
          } else if (name === 'OUTRO') {
            if (bar === 40) add(b0, 'crash');
            if (bar <= 41) { add(b0, 'kick'); add(b0 + 2, 'kick'); }
            if (bar === 42) add(b0, 'bass', ch.bass, SPB * 4);
          }
        },
      },
      layout(w, h, snap) {
        W = w; H = h;
        const top = Math.max(78, H * 0.1), bottom = Math.max(62, H * 0.08);
        let x0 = 50;
        const x1 = W - 50;
        if (kit.wide()) x0 = Math.max(W * 0.42, 560);
        const aw = x1 - x0, ah = H - top - bottom;
        const rw = Math.min(aw, ah * 1.6), rh = Math.min(ah, aw * 2);
        RG.w = rw; RG.h = rh; RG.x = x0 + (aw - rw) / 2; RG.y = top + (ah - rh) / 2;
        if (snap) Object.assign(R, RG);
      },
      update(now, dt) {
        VIEW = kit.view(1.4);
        const k = Math.min(1, dt * 4);
        for (const key of ['x', 'y', 'w', 'h']) R[key] += (RG[key] - R[key]) * k;
      },
      draw(now, dt) {
        const beat = now / SPB, bar = Math.floor(beat / 4);
        const name = SECTIONS[kit.secIndex(SECTIONS, bar)].name;
        const pulse = kit.pulse(beat, !['INTRO', 'BREAK'].includes(name) || bar === 31);
        drawBackground(beat, pulse);
        if (kit.playing()) drawCentre(now);
        drawBalls(now);
        drawWalls(now, pulse);
        drawEffects(dt);
      },
      onJudge(n, grade, now) {
        if (grade === 'miss') return;
        const p = ballAt(n.ball, now) || n.ball.frames[0].p;
        const [x, y] = px(p);
        burst(x, y, n.lane, WALLS[n.lane].rgb, grade === 'perfect' ? 1 : 0.6);
        S.flash[n.lane] = 1;
      },
      onNewRun() { particles.length = 0; rings.length = 0; },
    };
  });

  // ---------------------------------------------------------------------
  //  HOTARU: dancing receptors. Four firefly receptors dance through
  //  choreographed figures; curved light streams home in on them.
  // ---------------------------------------------------------------------
  defineMode((kit) => {
    const { g, rgba, hex, S, TAU } = kit;
    const BPM = 132, SPB = 60 / BPM;
    const theme = { ink: '#060d0b', ink2: '#0f2019', panel: 'rgba(6, 13, 11, 0.84)', paper: '#eef6ee', muted: '#98ad9f', accent: '#ffc84a' };
    const INK = hex(theme.ink), INK2 = hex(theme.ink2), PAPER = hex(theme.paper), MUTED = hex(theme.muted);
    const LANES = [
      { label: 'D', name: '若葉', color: '#a6f05a' },
      { label: 'F', name: '山吹', color: '#ffc84a' },
      { label: 'J', name: '空', color: '#5ad8ff' },
      { label: 'K', name: '撫子', color: '#ff7ab0' },
    ].map((l) => ({ ...l, rgb: hex(l.color) }));
    const SECTIONS = [
      { bar: 0, name: 'INTRO', hue: 2 }, { bar: 4, name: 'VERSE', hue: 0 }, { bar: 12, name: 'BUILD', hue: 1 },
      { bar: 20, name: 'CHORUS', hue: 3 }, { bar: 28, name: 'BREAK', hue: 2 }, { bar: 32, name: 'CHORUS II', hue: 3 },
      { bar: 40, name: 'OUTRO', hue: 0 },
    ];
    const BARS = kit.std4();
    // Dances: where each firefly sits, in units of the play area (x right, y down), at a beat.
    const DANCES = {
      line: (l) => [(l - 1.5) * 0.4, 0.12],
      wave: (l, b) => [(l - 1.5) * 0.42, 0.26 * Math.sin((b * Math.PI) / 2 + l * 1.1)],
      diamond: (l, b) => { const a = (l * TAU) / 4 + (b * Math.PI) / 16; return [0.46 * Math.cos(a), 0.4 * Math.sin(a)]; },
      spin: (l, b) => { const a = (l * TAU) / 4 + (b * Math.PI) / 4; return [0.42 * Math.cos(a), 0.36 * Math.sin(a)]; },
      lissa: (l, b) => { const a = (b * Math.PI) / 8 + (l * Math.PI) / 2; return [0.6 * Math.sin(a), 0.4 * Math.sin(2 * a)]; },
      pairs: (l, b) => {
        const c = l < 2 ? -0.38 : 0.38, dir = l < 2 ? 1 : -1;
        const a = ((b * Math.PI) / 4) * dir + (l % 2) * Math.PI;
        return [c + 0.18 * Math.cos(a), 0.2 * Math.sin(a)];
      },
    };
    // [bar, dance]; each change glides over 2 beats.
    const DANCE_TL = [
      [0, 'line'], [4, 'wave'], [12, 'diamond'], [16, 'spin'], [20, 'lissa'], [28, 'pairs'],
      [32, 'lissa'], [34, 'spin'], [36, 'lissa'], [38, 'spin'], [40, 'line'],
    ];
    // G - Em - C - D. Lead pitch per firefly.
    const CHORDS = [
      { pad: [55, 59, 62], bass: 43, lead: [67, 71, 74, 79] },
      { pad: [55, 59, 64], bass: 40, lead: [67, 71, 76, 79] },
      { pad: [55, 60, 64], bass: 36, lead: [67, 72, 76, 79] },
      { pad: [54, 57, 62], bass: 38, lead: [66, 69, 74, 78] },
    ];
    const CHART = kit.sortChart(kit.parseLanes(BARS, SPB, 4));
    const kickBar = (bar) => { const n = SECTIONS[kit.secIndex(SECTIONS, bar)].name; return (n !== 'INTRO' && n !== 'BREAK') || bar === 31; };

    // ----- layout -----
    let W = 0, H = 0, VIEW = 1.5;
    const A = { cx: 0, cy: 0, u: 1, portrait: false }, AG = { cx: 0, cy: 0, u: 1 };
    const recR = () => Math.max(18, Math.min(36, A.u * 0.075));
    function recPos(l, t) {
      const beat = t / SPB;
      let i = 0;
      for (let k = 0; k < DANCE_TL.length; k++) if (DANCE_TL[k][0] * 4 <= beat) i = k;
      let [x, y] = DANCES[DANCE_TL[i][1]](l, beat);
      if (i > 0) {
        const k = (beat - DANCE_TL[i][0] * 4) / 2;
        if (k < 1) {
          const [px0, py0] = DANCES[DANCE_TL[i - 1][1]](l, beat);
          const e = 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, k));
          x = px0 + (x - px0) * e; y = py0 + (y - py0) * e;
        }
      }
      // a little hop on every kick: lands on the beat, peaks halfway
      if (beat >= 0 && kickBar(Math.floor(beat / 4))) y -= 0.035 * Math.sin(Math.PI * (beat - Math.floor(beat)));
      if (A.portrait) { const tx = x; x = -y; y = tx; }
      return [A.cx + x * A.u, A.cy + y * A.u];
    }
    // light stream for note n: quadratic curve from its source to the firefly as it is now
    // Each stream comes in from straight behind its firefly (outward from the middle of the dance),
    // so the closest light to a firefly is always the next one; left-hand colours curl one way, right-hand the other.
    function streamPoint(n, k, now, end) {
      const hit = recPos(n.lane, n.t);
      const D = Math.max(W, H) * 0.75;
      let from = Math.atan2(hit[1] - A.cy, hit[0] - A.cx);
      if (Math.hypot(hit[0] - A.cx, hit[1] - A.cy) < A.u * 0.05) from = n.lane < 2 ? Math.PI : 0;
      const curl = n.lane < 2 ? -1 : 1;
      const sx = hit[0] + Math.cos(from) * D, sy = hit[1] + Math.sin(from) * D;
      const mx = (sx + hit[0]) / 2, my = (sy + hit[1]) / 2;
      const cx = mx - Math.sin(from) * D * 0.3 * curl, cy = my + Math.cos(from) * D * 0.3 * curl;
      const e = end || recPos(n.lane, now);
      const a = (1 - k) * (1 - k), b = 2 * (1 - k) * k, c = k * k;
      return [a * sx + b * cx + c * e[0], a * sy + b * cy + c * e[1]];
    }

    // ----- effects -----
    const particles = [], rings = [];
    function burst(x, y, col, power) {
      rings.push({ x, y, col, life: 0, max: 0.4 });
      const n = kit.reduceMotion ? 4 : Math.round(18 * power);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * TAU, v = (100 + Math.random() * 260) * power;
        particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: 0, max: 0.4 + Math.random() * 0.5, col, size: 1.4 + Math.random() * 2.4 });
      }
    }
    function drawEffects(dt) {
      g.globalCompositeOperation = 'lighter';
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i]; r.life += dt;
        if (r.life > r.max) { rings.splice(i, 1); continue; }
        const u = r.life / r.max;
        g.strokeStyle = rgba(r.col, 0.85 * (1 - u)); g.lineWidth = 3 * (1 - u) + 1;
        g.beginPath(); g.arc(r.x, r.y, recR() * (1.1 + u * 1.8), 0, TAU); g.stroke();
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.life += dt;
        if (p.life > p.max) { particles.splice(i, 1); continue; }
        p.vx *= 1 - dt * 2; p.vy = p.vy * (1 - dt * 2) - 30 * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        g.fillStyle = rgba(p.col, 1 - p.life / p.max);
        g.beginPath(); g.arc(p.x, p.y, p.size, 0, TAU); g.fill();
      }
      g.globalCompositeOperation = 'source-over';
    }
    // night pond: soft drifting lights behind everything
    const bokeh = Array.from({ length: kit.reduceMotion ? 0 : 46 }, (_, i) => ({ x: Math.random(), y: Math.random(), r: 6 + Math.random() * 26, s: 0.004 + Math.random() * 0.012, c: i % 4, ph: Math.random() * TAU }));
    function drawBackground(now, beat, pulse, dt) {
      const bg = g.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, rgba(INK, 1)); bg.addColorStop(1, rgba(INK2, 1));
      g.fillStyle = bg; g.fillRect(0, 0, W, H);
      const hue = LANES[SECTIONS[kit.secIndex(SECTIONS, Math.floor(beat / 4))].hue].rgb;
      const glow = g.createRadialGradient(A.cx, A.cy, 0, A.cx, A.cy, A.u * 1.1);
      glow.addColorStop(0, rgba(hue, 0.09 + 0.07 * pulse)); glow.addColorStop(1, rgba(hue, 0));
      g.fillStyle = glow; g.fillRect(0, 0, W, H);
      g.globalCompositeOperation = 'lighter';
      for (const b of bokeh) {
        b.y -= b.s * dt; b.x += Math.sin(now * 0.3 + b.ph) * 0.0006;
        if (b.y < -0.05) { b.y = 1.05; b.x = Math.random(); }
        const a = 0.035 + 0.03 * Math.sin(now * 1.3 + b.ph);
        g.fillStyle = rgba(LANES[b.c].rgb, Math.max(0, a));
        g.beginPath(); g.arc(b.x * W, b.y * H, b.r, 0, TAU); g.fill();
      }
      g.globalCompositeOperation = 'source-over';
    }
    function drawStreams(now) {
      const r = recR();
      const chords = [];
      g.lineCap = 'round';
      for (let i = S.notes.length - 1; i >= 0; i--) {
        const n = S.notes[i];
        if (n.t - now > VIEW || n.end < now - 0.1) continue;
        const col = LANES[n.lane].rgb;
        const end = recPos(n.lane, now);
        const kHead = Math.min(1, 1 - (n.t - now) / VIEW);
        const holding = kit.holding(n);
        if (n.dur > 0 && n.tail === null && n.head !== 'miss') {
          // a hold is a long ribbon: its tail travels the same curve one hold-length later
          const kTail = Math.max(0, 1 - (n.end - now) / VIEW);
          const k0 = kTail, k1 = holding ? 1 : Math.max(0, kHead);
          if (k1 > k0) {
            g.beginPath();
            const steps = 24;
            for (let s = 0; s <= steps; s++) {
              const [x, y] = streamPoint(n, k0 + ((k1 - k0) * s) / steps, now, end);
              if (s === 0) g.moveTo(x, y); else g.lineTo(x, y);
            }
            g.globalCompositeOperation = 'lighter';
            g.strokeStyle = rgba(col, holding ? 0.35 : 0.22); g.lineWidth = r * 0.9; g.stroke();
            g.globalCompositeOperation = 'source-over';
            g.strokeStyle = rgba(col, 0.9); g.lineWidth = 2.5; g.stroke();
          }
        }
        if (n.head || kHead < 0) continue;
        // approach ring closing on the firefly
        const k = (n.t - now) / (VIEW * 0.6);
        if (k < 1) {
          g.strokeStyle = rgba(col, 0.25 + 0.6 * (1 - k)); g.lineWidth = 2;
          g.beginPath(); g.arc(end[0], end[1], r * (1 + 1.8 * Math.max(0, k)), 0, TAU); g.stroke();
        }
        // comet: bright head with a tail along its curve
        const appear = Math.min(1, kHead / 0.08);
        g.globalCompositeOperation = 'lighter';
        for (let s = 12; s >= 1; s--) {
          const kk = kHead - s * 0.012;
          if (kk < 0) continue;
          const [x, y] = streamPoint(n, kk, now, end);
          g.fillStyle = rgba(col, 0.2 * (1 - s / 13) * appear);
          g.beginPath(); g.arc(x, y, r * 0.42 * (1 - s / 16), 0, TAU); g.fill();
        }
        const [hx, hy] = streamPoint(n, kHead, now, end);
        // join chord partners only once they are close in, or the bar would cross the whole screen
        const onScreen = hx > 0 && hx < W && hy > 0 && hy < H;
        if (n.chord && kHead > 0.7 && onScreen) chords.push({ t: n.t, x: hx, y: hy, a: Math.min(1, (kHead - 0.7) / 0.12) });
        g.fillStyle = rgba(col, 0.35 * appear);
        g.beginPath(); g.arc(hx, hy, r * 0.75, 0, TAU); g.fill();
        g.globalCompositeOperation = 'source-over';
        g.fillStyle = rgba(col, appear);
        g.beginPath(); g.arc(hx, hy, r * 0.32, 0, TAU); g.fill();
        g.fillStyle = rgba(PAPER, 0.9 * appear);
        g.beginPath(); g.arc(hx, hy, r * 0.14, 0, TAU); g.fill();
      }
      kit.chordLines(chords, PAPER);
    }
    function drawFireflies(now) {
      const r = recR();
      g.lineCap = 'round';
      for (let l = 0; l < 4; l++) {
        g.beginPath();
        for (let s = 0; s <= 16; s++) {
          const [x, y] = recPos(l, now - s * 0.03);
          if (s === 0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.strokeStyle = rgba(LANES[l].rgb, 0.18); g.lineWidth = r * 0.35; g.stroke();
      }
      for (let l = 0; l < 4; l++) {
        const [x, y] = recPos(l, now), col = LANES[l].rgb;
        const down = S.pressed[l] || S.autoHold[l] > now;
        const aura = g.createRadialGradient(x, y, r * 0.4, x, y, r * 2.6);
        aura.addColorStop(0, rgba(col, 0.32 + 0.3 * S.flash[l] + (down ? 0.15 : 0))); aura.addColorStop(1, rgba(col, 0));
        g.globalCompositeOperation = 'lighter';
        g.fillStyle = aura; g.beginPath(); g.arc(x, y, r * 2.6, 0, TAU); g.fill();
        g.globalCompositeOperation = 'source-over';
        g.fillStyle = down ? rgba(col, 0.6) : rgba(INK, 0.8);
        g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
        g.strokeStyle = rgba(col, 1); g.lineWidth = 3; g.stroke();
        g.fillStyle = rgba(PAPER, 0.95);
        g.font = `${Math.round(r * 0.9)}px "Dela Gothic One", sans-serif`;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(LANES[l].label, x, y + 1);
      }
    }
    const GRADE_COLOR = { perfect: PAPER, great: LANES[1].rgb, good: LANES[2].rgb, miss: MUTED };
    // the judgement floats just above the firefly that was hit
    function drawPopup(now) {
      if (!S.popup || now - S.popup.t > 0.5) return;
      const age = now - S.popup.t;
      const [x, y] = recPos(S.popup.n.lane, now);
      const k = 1 + 0.25 * Math.max(0, 1 - age * 8);
      g.save();
      g.translate(x, y - recR() * 1.9 - age * 30); g.scale(k, k);
      g.globalAlpha = Math.min(1, (0.5 - age) * 5);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = '15px "Dela Gothic One", sans-serif';
      g.fillStyle = rgba(GRADE_COLOR[S.popup.grade], 1);
      g.fillText(S.popup.grade.toUpperCase(), 0, 0);
      g.restore();
    }

    return {
      id: 'hotaru', name: 'HOTARU', kind: '踊るレセプター', kana: '蛍の舞 ・ 踊るレセプター',
      blurb: '受け皿の蛍が曲に合わせて踊る。曲線を描いて追いかけてくる光の筋を受け止める。',
      lede: '4匹の蛍（受け皿）が曲に合わせて踊ります。光の筋が曲線を描いて蛍を追いかけ、<strong>蛍に届いた瞬間</strong>に、その蛍の色のキーを押します。縮んでいく輪がタイミングの目安です。',
      keys: LANES.map((l) => ({ label: l.label, name: l.name, color: l.color })),
      touchHint: 'スマホは蛍をタップ',
      meta: 'BPM 132 ・ 44小節 ・ 約1分20秒 ・ 踊りは 横一列 → 波 → ひし形 → 8の字 → ペア回転 と変わります。',
      theme, attractFromBar: 20,
      bpm: BPM, bars: 44, sections: SECTIONS, chords: CHORDS, chart: CHART,
      laneCodes: [['KeyD'], ['KeyF'], ['KeyJ'], ['KeyK']],
      touchLane(x, y, now) {
        let best = -1, bd = Infinity;
        for (let l = 0; l < 4; l++) { const [rx, ry] = recPos(l, now); const d = Math.hypot(rx - x, ry - y); if (d < bd) { bd = d; best = l; } }
        return bd > recR() * 2.4 ? -1 : best;
      },
      progressColor: (beat) => rgba(LANES[SECTIONS[kit.secIndex(SECTIONS, Math.max(0, Math.floor(beat / 4)))].hue].rgb, 0.9),
      song: {
        bass: { wave: 'triangle', subShift: 0, sub: 0.7, q: 4, open: 900, close: 200 },
        pad: { wave: 'sawtooth', cutoff: 1100, level: 0.05, detune: 10, attack: 0.4 },
        delay: { beats: 0.75, feedback: 0.32, mix: 0.25 }, leadLevel: 0.55, leadSend: 0.4, padBus: 0.85,
        leadMidi: (n) => CHORDS[Math.floor(n.beat / 4) % 4].lead[n.lane],
        // Kalimba-like pluck: a sine whose pitch is briefly frequency-modulated, then rings out.
        lead(A2, at, midi, dur) {
          const { ac } = A2, f0 = A2.mtof(midi);
          const gn = ac.createGain();
          gn.gain.setValueAtTime(0.0001, at); gn.gain.exponentialRampToValueAtTime(0.3, at + 0.003);
          if (dur < 0.3) gn.gain.exponentialRampToValueAtTime(0.0001, at + 0.6);
          else { gn.gain.exponentialRampToValueAtTime(0.11, at + 0.2); gn.gain.setValueAtTime(0.11, at + dur); gn.gain.exponentialRampToValueAtTime(0.0001, at + dur + 0.4); }
          gn.connect(A2.bus.lead);
          const end = at + Math.max(0.65, dur + 0.45);
          const car = ac.createOscillator(); car.type = 'sine'; car.frequency.value = f0;
          const mod = ac.createOscillator(); mod.type = 'sine'; mod.frequency.value = f0 * 3.5;
          const mg = ac.createGain();
          mg.gain.setValueAtTime(f0 * 1.6, at); mg.gain.exponentialRampToValueAtTime(1, at + 0.18);
          mod.connect(mg).connect(car.frequency);
          car.connect(gn);
          car.start(at); mod.start(at); car.stop(end); mod.stop(end);
        },
        arrange(add, bar, b0, ch, name) {
          if (name === 'INTRO') {
            if (bar >= 2) for (let i = 0; i < 8; i++) add(b0 + i / 2, 'shaker');
          } else if (name === 'VERSE') {
            for (let i = 0; i < 4; i++) { add(b0 + i, 'kick'); add(b0 + i + 0.5, 'shaker'); add(b0 + i + 0.5, 'bass', ch.bass, SPB * 0.45); }
          } else if (name === 'BUILD') {
            for (let i = 0; i < 4; i++) { add(b0 + i, 'kick'); add(b0 + i + 0.5, 'bass', ch.bass, SPB * 0.45); }
            for (let i = 0; i < 16; i++) add(b0 + i / 4, 'hat', false);
            if (bar === 19) for (let i = 8; i < 16; i++) add(b0 + i / 4, 'snare');
            else { add(b0 + 1, 'snare'); add(b0 + 3, 'snare'); }
          } else if (name === 'CHORUS' || name === 'CHORUS II') {
            if (bar % 4 === 0) add(b0, 'crash');
            for (let i = 0; i < 4; i++) {
              add(b0 + i, 'kick');
              add(b0 + i, 'bass', ch.bass, SPB * 0.45); add(b0 + i + 0.5, 'bass', ch.bass + 12, SPB * 0.45);
              add(b0 + i + 0.5, 'hat', true);
              add(b0 + i + 0.25, 'shaker'); add(b0 + i + 0.75, 'shaker');
            }
            add(b0 + 1, 'snare'); add(b0 + 3, 'snare');
          } else if (name === 'BREAK') {
            add(b0, 'bass', ch.bass, SPB * 3.5);
            for (let i = 0; i < 8; i++) add(b0 + i / 2, 'shaker');
            if (bar === 31) { for (let i = 0; i < 4; i++) add(b0 + i, 'kick'); for (let i = 8; i < 16; i++) add(b0 + i / 4, 'snare'); }
          } else if (name === 'OUTRO') {
            if (bar === 40) add(b0, 'crash');
            if (bar <= 41) { add(b0, 'kick'); add(b0 + 2, 'kick'); }
            if (bar === 42) add(b0, 'bass', ch.bass, SPB * 4);
          }
        },
      },
      layout(w, h, snap) {
        W = w; H = h;
        const top = Math.max(70, H * 0.09), bottom = Math.max(50, H * 0.06);
        let x0 = 30;
        const x1 = W - 30;
        if (kit.wide()) x0 = Math.max(W * 0.42, 560);
        const aw = x1 - x0, ah = H - top - bottom;
        A.portrait = ah > aw * 1.2;
        // dances span about ±0.65 across and ±0.5 down; on a tall screen they turn sideways
        AG.u = A.portrait ? Math.min(aw / 2 / 0.55, ah / 2 / 0.7) : Math.min(aw / 2 / 0.7, ah / 2 / 0.55);
        AG.cx = x0 + aw / 2; AG.cy = top + ah / 2;
        if (snap) Object.assign(A, AG);
      },
      update(now, dt) {
        VIEW = kit.view(1.5);
        const k = Math.min(1, dt * 4);
        for (const key of ['cx', 'cy', 'u']) A[key] += (AG[key] - A[key]) * k;
      },
      draw(now, dt) {
        const beat = now / SPB;
        drawBackground(now, beat, kit.pulse(beat, kickBar(Math.floor(beat / 4))), dt);
        drawStreams(now);
        drawFireflies(now);
        drawEffects(dt);
        if (kit.playing()) drawPopup(now);
      },
      onJudge(n, grade, now) {
        if (grade === 'miss') return;
        const [x, y] = recPos(n.lane, now);
        burst(x, y, LANES[n.lane].rgb, grade === 'perfect' ? 1 : 0.6);
        S.flash[n.lane] = 1;
      },
      onNewRun() { particles.length = 0; rings.length = 0; },
    };
  });

  // ---------------------------------------------------------------------
  //  MINAMO: expanding rings. Drops land on a water surface and their
  //  ripples spread; still notes are struck when their ripple arrives.
  //  Aim-based input: mouse + Z/X or click, or tap the note.
  // ---------------------------------------------------------------------
  defineMode((kit) => {
    const { g, rgba, hex, S, TAU, DEG } = kit;
    const BPM = 120, SPB = 60 / BPM;
    const theme = { ink: '#04121a', ink2: '#0a2a38', panel: 'rgba(4, 18, 26, 0.84)', paper: '#eaf6f7', muted: '#93b2ba', accent: '#ffd36e' };
    const INK = hex(theme.ink), INK2 = hex(theme.ink2), PAPER = hex(theme.paper), MUTED = hex(theme.muted);
    const HUE_DEFS = [
      { name: '青磁', color: '#5ee6d6' }, { name: '藤納戸', color: '#8fa8ff' },
      { name: '月', color: '#ffd36e' }, { name: '蓮', color: '#ff8fb1' },
    ];
    const HUES = HUE_DEFS.map((h) => hex(h.color));
    const SECTIONS = [
      { bar: 0, name: 'INTRO', hue: 0 }, { bar: 4, name: 'VERSE', hue: 1 }, { bar: 12, name: 'BUILD', hue: 2 },
      { bar: 20, name: 'CHORUS', hue: 3 }, { bar: 28, name: 'BREAK', hue: 1 }, { bar: 32, name: 'CHORUS II', hue: 3 },
      { bar: 40, name: 'OUTRO', hue: 0 },
    ];

    // ----- drops (ripple sources) and the notes their ripple reaches -----
    // Positions are in field units: the field is about ±0.8 wide and ±0.48 tall around its centre.
    // A ripple grows at `speed` units per beat, so a note n beats after the drop sits n*speed away.
    const BOUND_X = 0.74, BOUND_Y = 0.42;
    const DROPS = [];
    // pattern: 8th-note steps after the drop. 'o' tap, 'H' hold (follow the ripple outward) while '-' follows.
    // Each next note turns `dAng` degrees from the last; a note that would leave the field turns further until it fits.
    function drop(beat, x, y, hue, pattern, ang0 = -90, dAng = 70, speed = 0.11) {
      const d = { beat, t: beat * SPB, x, y, hue, speed, notes: [] };
      const seq = pattern.replace(/[|\s]/g, '');
      let ang = ang0;
      for (let i = 0; i < seq.length; i++) {
        const c = seq[i];
        if (c !== 'o' && c !== 'H') continue;
        let len = 0;
        if (c === 'H') { let j = i + 1; while (j < seq.length && seq[j] === '-') j++; len = j - i; }
        const off = i / 2, offEnd = (i + len) / 2, far = speed * offEnd;
        let a = ang, tries = 0;
        const fits = (aa) => Math.abs(x + Math.cos(aa * DEG) * far) <= BOUND_X && Math.abs(y + Math.sin(aa * DEG) * far) <= BOUND_Y;
        while (tries < 24 && !fits(a)) { a += 15; tries++; }
        if (tries === 24) console.warn(`minamo: drop at beat ${beat}: note ${off} does not fit`);
        d.notes.push({ off, offEnd, ang: a });
        ang = a + dAng;
      }
      DROPS.push(d);
    }
    // INTRO: one drop at a time, quarter notes spiralling out
    drop(0, 0, 0, 0, '..o.o.o.o.o.o...', -90, 80);
    drop(8, -0.3, 0.05, 1, '..o.o.o.o.o.o...', 0, -80);
    // VERSE: drops alternate sides, with an eighth pair and a first hold
    drop(16, 0.4, -0.15, 2, '..o.o.o.oo..o.o.', 180, 55);
    drop(24, -0.4, 0.15, 3, '..o.o.o.oo..o.o.', 0, -55);
    drop(32, 0.35, 0.18, 0, '..o.o.o.H---..o.', 200, 65);
    drop(40, -0.35, -0.18, 1, '..o.o.oo..o.o.o.', 20, -65);
    // BUILD: two drops land together; their notes take turns across the field
    [[48, -0.42, -0.1, 0.42, 0.1], [56, -0.4, 0.15, 0.4, -0.15], [64, 0.1, -0.22, -0.1, 0.22], [72, -0.45, 0, 0.45, 0]].forEach(([b, x1, y1, x2, y2], k) => {
      const last = k === 3;
      drop(b, x1, y1, 2, last ? '..o...o...o.....' : '..o...o...o...o.', 0, 40);
      drop(b, x2, y2, 3, last ? '....o...o...oooo' : '....o...o...o...', 180, -40);
    });
    // CHORUS: a new drop every bar from a different place, eighth runs curling around the drop
    const CH_SRC = [[-0.45, -0.18], [0.45, 0.18], [0.45, -0.18], [-0.45, 0.18], [0, -0.22], [0, 0.22], [-0.5, 0], [0.5, 0]];
    CH_SRC.forEach(([x, y], k) => {
      const pat = k % 4 === 3 ? '..o.H---' : k % 2 ? '..o.oo.o.o' : '..o.o.oooo';
      drop(80 + k * 4, x, y, k % 4, pat, k % 2 ? 160 : -20, k % 2 ? -35 : 35);
    });
    // BREAK: slow ripples from the centre, long holds you ride outward
    drop(112, 0, 0, 1, '..H---..H---', -90, 135, 0.09);
    drop(120, 0, 0, 3, '..o.o.o.H-----..', 30, 100, 0.09);
    // CHORUS II: pairs of drops; one side runs first, the other answers
    [[128, -0.4, -0.15, 0.4, 0.15], [136, 0.4, -0.15, -0.4, 0.15], [144, 0, -0.25, 0, 0.25], [152, -0.45, 0.1, 0.45, -0.1]].forEach(([b, x1, y1, x2, y2], k) => {
      drop(b, x1, y1, (k * 2) % 4, '..o.o.o.........', -60, 30);
      drop(b, x2, y2, (k * 2 + 1) % 4, '........o.o.o.oo', 120, 30);
    });
    // OUTRO
    drop(160, 0, 0, 0, '..o.o.o.o.o.o.o.', -90, 75);
    drop(168, 0, 0, 2, '..o...o...H-----', 0, 120, 0.09);

    const CHART = [];
    for (const d of DROPS) {
      d.notes.forEach((n, i) => {
        const beat = d.beat + n.off;
        CHART.push({ beat, t: beat * SPB, dur: (n.offEnd - n.off) * SPB, drop: d, ang: n.ang * DEG, idx: i, d0: d.speed * n.off, d1: d.speed * n.offEnd });
      });
      d.last = d.t + Math.max(...d.notes.map((n) => n.offEnd)) * SPB;
    }
    kit.sortChart(CHART);
    for (let i = 1; i < CHART.length; i++) {
      const a = CHART[i - 1], b = CHART[i];
      if (b.t - (a.t + a.dur) < 0.2) console.warn(`minamo: beat ${b.beat}: too close to the previous note to aim`);
    }
    // Fmaj7 - Em7 - Dm7 - Cmaj7; lead steps through the chord as a drop's notes go by.
    const CHORDS = [
      { pad: [53, 57, 60, 64], bass: 41, lead: [65, 69, 72, 76] },
      { pad: [52, 55, 59, 62], bass: 40, lead: [64, 67, 71, 74] },
      { pad: [50, 53, 57, 60], bass: 38, lead: [62, 65, 69, 72] },
      { pad: [48, 52, 55, 59], bass: 36, lead: [60, 64, 67, 71] },
    ];
    const kickBar = (bar) => { const n = SECTIONS[kit.secIndex(SECTIONS, bar)].name; return (n !== 'INTRO' && n !== 'BREAK') || bar === 31; };

    // ----- layout -----
    let W = 0, H = 0, VIEW = 1.8;
    const F = { cx: 0, cy: 0, u: 1, portrait: false }, FG = { cx: 0, cy: 0, u: 1 };
    // field units -> screen; on tall screens the field turns a quarter
    const toScreen = (x, y) => (F.portrait ? [F.cx - y * F.u, F.cy + x * F.u] : [F.cx + x * F.u, F.cy + y * F.u]);
    const noteR = () => Math.max(15, F.u * 0.045);
    // where a note sits, or for a hold, where the ripple front is along it at time t
    function notePos(n, t) {
      const d = n.dur > 0 ? Math.min(n.d1, Math.max(n.d0, n.d0 + ((t - n.t) / n.dur) * (n.d1 - n.d0))) : n.d0;
      return toScreen(n.drop.x + Math.cos(n.ang) * d, n.drop.y + Math.sin(n.ang) * d);
    }
    const rippleR = (drop, t) => ((t - drop.t) / SPB) * drop.speed * F.u;

    // ----- effects -----
    const particles = [], rings = [];
    let popups = [];
    const autoAim = { x: 0, y: 0 };
    function burst(x, y, col, power) {
      rings.push({ x, y, col, life: 0, max: 0.5 });
      const n = kit.reduceMotion ? 4 : Math.round(14 * power);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * TAU, v = (80 + Math.random() * 220) * power;
        particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 0.35 + Math.random() * 0.4, col, size: 1.3 + Math.random() * 2.2 });
      }
    }
    function drawEffects(dt) {
      g.globalCompositeOperation = 'lighter';
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i]; r.life += dt;
        if (r.life > r.max) { rings.splice(i, 1); continue; }
        const u = r.life / r.max;
        for (let k = 0; k < 2; k++) {
          g.strokeStyle = rgba(r.col, 0.7 * (1 - u) * (k ? 0.5 : 1));
          g.lineWidth = 2.5 * (1 - u) + 0.8;
          g.beginPath(); g.arc(r.x, r.y, noteR() * (1 + u * (2.6 - k)), 0, TAU); g.stroke();
        }
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.life += dt;
        if (p.life > p.max) { particles.splice(i, 1); continue; }
        p.vx *= 1 - dt * 3; p.vy *= 1 - dt * 3;
        p.x += p.vx * dt; p.y += p.vy * dt;
        g.fillStyle = rgba(p.col, 1 - p.life / p.max);
        g.beginPath(); g.arc(p.x, p.y, p.size, 0, TAU); g.fill();
      }
      g.globalCompositeOperation = 'source-over';
    }
    function drawBackground(now, beat, pulse) {
      const bg = g.createRadialGradient(F.cx, F.cy, 0, F.cx, F.cy, Math.max(W, H) * 0.8);
      bg.addColorStop(0, rgba(INK2, 1)); bg.addColorStop(1, rgba(INK, 1));
      g.fillStyle = bg; g.fillRect(0, 0, W, H);
      const hue = HUES[SECTIONS[kit.secIndex(SECTIONS, Math.floor(beat / 4))].hue];
      const glow = g.createRadialGradient(F.cx, F.cy, 0, F.cx, F.cy, F.u * 0.9);
      glow.addColorStop(0, rgba(hue, 0.06 + 0.05 * pulse)); glow.addColorStop(1, rgba(hue, 0));
      g.fillStyle = glow; g.fillRect(0, 0, W, H);
      // slow caustic shimmer
      if (!kit.reduceMotion) {
        g.strokeStyle = rgba(PAPER, 0.025); g.lineWidth = 1;
        for (let i = 0; i < 9; i++) {
          g.beginPath();
          for (let x = 0; x <= W; x += 24) {
            const y = (H * (i + 0.5)) / 9 + Math.sin(x * 0.012 + now * 0.6 + i * 1.7) * 10 + Math.sin(x * 0.031 - now * 0.4 + i) * 4;
            if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
          }
          g.stroke();
        }
      }
    }
    function drawRipples(now) {
      const maxR = Math.hypot(W, H);
      for (const d of DROPS) {
        const [sx, sy] = toScreen(d.x, d.y), col = HUES[d.hue];
        const lead = d.t - now;
        if (lead > 0 && lead < 0.7) {
          // the drop falling: a ring closing onto the spot
          const k = lead / 0.7;
          g.strokeStyle = rgba(col, 0.6 * (1 - k)); g.lineWidth = 2;
          g.beginPath(); g.arc(sx, sy, 6 + k * F.u * 0.12, 0, TAU); g.stroke();
          g.fillStyle = rgba(col, 0.8 * (1 - k));
          g.beginPath(); g.arc(sx, sy, 3 + 3 * (1 - k), 0, TAU); g.fill();
          continue;
        }
        if (lead > 0) continue;
        const r = rippleR(d, now);
        const fade = now < d.last ? 1 : Math.max(0, 1 - (now - d.last) / 1.6);
        if (fade <= 0 || r > maxR) continue;
        for (let k = 0; k < 3; k++) {
          const rr = r - k * F.u * 0.035;
          if (rr <= 0) continue;
          g.strokeStyle = rgba(col, (k === 0 ? 0.75 : 0.22 / k) * fade);
          g.lineWidth = k === 0 ? 2.5 : 1.5;
          g.beginPath(); g.arc(sx, sy, rr, 0, TAU); g.stroke();
        }
        g.fillStyle = rgba(col, 0.5 * fade);
        g.beginPath(); g.arc(sx, sy, 3, 0, TAU); g.fill();
      }
    }
    function drawNotes(now) {
      const r = noteR();
      g.lineCap = 'round';
      for (let i = S.notes.length - 1; i >= 0; i--) {
        const n = S.notes[i];
        if (n.t - now > VIEW || n.end < now - 0.05) continue;
        const col = HUES[n.drop.hue];
        const appear = Math.min(1, (VIEW - (n.t - now)) / 0.3);
        if (n.dur > 0 && n.tail === null && n.head !== 'miss') {
          // hold: a channel along the ripple's path; the light rides the ripple front
          const a = notePos(n, n.t), b = notePos(n, n.end), f = notePos(n, now);
          g.globalAlpha = appear;
          g.strokeStyle = rgba(col, 0.22); g.lineWidth = r * 1.6;
          g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
          g.strokeStyle = rgba(col, 0.7); g.lineWidth = 1.5;
          g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
          g.beginPath(); g.arc(b[0], b[1], r * 0.5, 0, TAU); g.stroke();
          if (kit.holding(n)) {
            g.globalCompositeOperation = 'lighter';
            g.fillStyle = rgba(col, 0.45);
            g.beginPath(); g.arc(f[0], f[1], r * 1.5, 0, TAU); g.fill();
            g.globalCompositeOperation = 'source-over';
            g.fillStyle = rgba(PAPER, 0.95);
            g.beginPath(); g.arc(f[0], f[1], r * 0.45, 0, TAU); g.fill();
          }
          g.globalAlpha = 1;
        }
        if (n.head) continue;
        const [x, y] = notePos(n, n.t);
        // fills from the centre as its ripple closes in
        const k = Math.max(0, Math.min(1, 1 - (n.t - now) / VIEW));
        g.globalAlpha = appear;
        // faint thread back to the drop that will reach it, so you know which ring to watch
        const [sx, sy] = toScreen(n.drop.x, n.drop.y);
        g.setLineDash([2, 7]);
        g.strokeStyle = rgba(col, 0.22); g.lineWidth = 1.2;
        g.beginPath(); g.moveTo(sx, sy); g.lineTo(x, y); g.stroke();
        g.setLineDash([]);
        g.fillStyle = rgba(INK, 0.75);
        g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
        g.fillStyle = rgba(col, 0.25 + 0.35 * k);
        g.beginPath(); g.arc(x, y, r * k, 0, TAU); g.fill();
        g.strokeStyle = rgba(col, 1); g.lineWidth = 3;
        g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke();
        g.fillStyle = rgba(PAPER, 0.9);
        g.beginPath(); g.arc(x, y, r * 0.18, 0, TAU); g.fill();
        g.globalAlpha = 1;
      }
    }
    function drawAim(now, dt) {
      let p = null;
      if (S.auto) {
        // autoplay glides toward the next note it will strike
        let target = null;
        for (let i = S.cursor; i < S.notes.length; i++) {
          const n = S.notes[i];
          if (kit.holding(n)) { target = notePos(n, now); break; }
          if (!n.head) { target = notePos(n, n.t); break; }
        }
        if (target) {
          const k = Math.min(1, dt * 10);
          autoAim.x += (target[0] - autoAim.x) * k; autoAim.y += (target[1] - autoAim.y) * k;
        }
        p = autoAim;
      } else if (kit.playing() && !S.touch) p = S.aim;
      if (!p) return;
      const r = noteR();
      g.strokeStyle = rgba(PAPER, 0.9); g.lineWidth = 2;
      g.beginPath(); g.arc(p.x, p.y, r * 0.7, 0, TAU); g.stroke();
      g.fillStyle = rgba(PAPER, 0.9);
      g.beginPath(); g.arc(p.x, p.y, 2.5, 0, TAU); g.fill();
      g.strokeStyle = rgba(PAPER, 0.25); g.lineWidth = 1;
      g.beginPath(); g.arc(p.x, p.y, r * 1.8, 0, TAU); g.stroke();
    }
    const GRADE_COLOR = { perfect: PAPER, great: HUES[2], good: HUES[0], miss: MUTED };
    function drawPopups(now) {
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = '14px "Dela Gothic One", sans-serif';
      popups = popups.filter((p) => now - p.t < 0.5);
      for (const p of popups) {
        const age = now - p.t;
        g.globalAlpha = Math.min(1, (0.5 - age) * 5);
        g.fillStyle = rgba(GRADE_COLOR[p.grade], 1);
        g.fillText(p.grade.toUpperCase(), p.x, p.y - noteR() * 1.7 - age * 24);
      }
      g.globalAlpha = 1;
    }

    return {
      id: 'minamo', name: 'MINAMO', kind: '広がる円', kana: '水面の輪 ・ 広がる円',
      blurb: '縮む円の逆。水面に広がる波紋が、浮かんで待つノーツに届いた瞬間に狙って叩く。',
      lede: '水面に雫が落ちると波紋が広がります。ノーツは水面に浮かんで待っていて、<strong>波紋が届いた瞬間</strong>に、そのノーツを狙って叩きます。同じ色の波紋が、そのノーツの合図です。',
      keys: HUE_DEFS.map((h) => ({ label: '●', name: h.name, color: h.color })),
      how: [
        ['パソコン', 'マウスでノーツに照準を合わせ、<kbd>Z</kbd> <kbd>X</kbd> かクリックで叩く'],
        ['スマホ', 'ノーツを直接タップ'],
        ['長押し', '波紋と一緒に外へ動く光を、押したまま追いかける'],
      ],
      speedHint: 'ノーツが浮かび上がる早さ（波紋の速さは曲で決まっています）',
      touchHint: 'この形式は位置を狙う入力です',
      meta: 'BPM 120 ・ 44小節 ・ 約1分30秒 ・ ノーツから雫の落ちた点へ細い点線が伸びます。色の丸は波紋の色で、キーではありません。',
      theme, attractFromBar: 20, input: 'aim',
      bpm: BPM, bars: 44, sections: SECTIONS, chords: CHORDS, chart: CHART,
      hitTest(n, x, y) { const [nx, ny] = notePos(n, n.t); return Math.hypot(nx - x, ny - y) <= noteR() * 1.8; },
      followPos: (n, now) => notePos(n, now),
      followReach: () => noteR() * 2.6,
      progressColor: (beat) => rgba(HUES[SECTIONS[kit.secIndex(SECTIONS, Math.max(0, Math.floor(beat / 4)))].hue], 0.9),
      song: {
        bass: { wave: 'triangle', subShift: 0, sub: 1, q: 3, open: 700, close: 180 },
        pad: { wave: 'sawtooth', cutoff: 1000, level: 0.04, detune: 8, attack: 0.5 },
        delay: { beats: 0.75, feedback: 0.34, mix: 0.26 }, leadLevel: 0.6, leadSend: 0.45, padBus: 0.85,
        leadMidi: (n) => CHORDS[Math.floor(n.beat / 4) % 4].lead[n.idx % 4],
        // Water drop: a sine that swoops up into its pitch, then rings into the reverb.
        lead(A, at, midi, dur) {
          const { ac } = A, f0 = A.mtof(midi);
          const gn = ac.createGain();
          gn.gain.setValueAtTime(0.0001, at); gn.gain.exponentialRampToValueAtTime(0.3, at + 0.004);
          if (dur < 0.3) gn.gain.exponentialRampToValueAtTime(0.0001, at + 0.5);
          else { gn.gain.exponentialRampToValueAtTime(0.12, at + 0.2); gn.gain.setValueAtTime(0.12, at + dur); gn.gain.exponentialRampToValueAtTime(0.0001, at + dur + 0.4); }
          gn.connect(A.bus.lead);
          const end = at + Math.max(0.55, dur + 0.45);
          const o = ac.createOscillator(); o.type = 'sine';
          o.frequency.setValueAtTime(f0 * 0.7, at); o.frequency.exponentialRampToValueAtTime(f0, at + 0.035);
          const o2 = ac.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f0 * 2;
          const g2 = A.decayGain(at, 0.12, 0.002, 0.12);
          o.connect(gn); o2.connect(g2).connect(gn);
          o.start(at); o2.start(at); o.stop(end); o2.stop(end);
        },
        arrange(add, bar, b0, ch, name) {
          if (name === 'INTRO') {
            if (bar >= 2) for (let i = 0; i < 4; i++) add(b0 + i + 0.5, 'hat', false);
          } else if (name === 'VERSE') {
            add(b0, 'kick'); add(b0 + 2.5, 'kick');
            for (let i = 0; i < 4; i++) add(b0 + i + 0.5, 'hat', false);
            add(b0 + 2, 'snare');
            add(b0, 'bass', ch.bass, SPB * 1.4); add(b0 + 2.5, 'bass', ch.bass, SPB * 1.2);
          } else if (name === 'BUILD') {
            for (let i = 0; i < 4; i++) { add(b0 + i, 'kick'); add(b0 + i + 0.5, 'bass', ch.bass, SPB * 0.45); }
            for (let i = 0; i < 8; i++) add(b0 + i / 2, 'hat', false);
            if (bar === 19) for (let i = 8; i < 16; i++) add(b0 + i / 4, 'snare');
            else { add(b0 + 1, 'snare'); add(b0 + 3, 'snare'); }
          } else if (name === 'CHORUS' || name === 'CHORUS II') {
            if (bar % 4 === 0) add(b0, 'crash');
            for (let i = 0; i < 4; i++) {
              add(b0 + i, 'kick');
              add(b0 + i + 0.5, 'hat', true);
              add(b0 + i, 'bass', ch.bass, SPB * 0.4); add(b0 + i + 0.5, 'bass', ch.bass + 12, SPB * 0.4);
            }
            add(b0 + 1, 'snare'); add(b0 + 3, 'snare');
          } else if (name === 'BREAK') {
            add(b0, 'bass', ch.bass, SPB * 3.5);
            if (bar === 31) { for (let i = 0; i < 4; i++) add(b0 + i, 'kick'); for (let i = 8; i < 16; i++) add(b0 + i / 4, 'snare'); }
          } else if (name === 'OUTRO') {
            if (bar === 40) add(b0, 'crash');
            if (bar <= 41) { add(b0, 'kick'); add(b0 + 2.5, 'kick'); }
            if (bar === 42) add(b0, 'bass', ch.bass, SPB * 4);
          }
        },
      },
      layout(w, h, snap) {
        W = w; H = h;
        const top = Math.max(70, H * 0.09), bottom = Math.max(30, H * 0.04);
        let x0 = 24;
        const x1 = W - 24;
        if (kit.wide()) x0 = Math.max(W * 0.42, 560);
        const aw = x1 - x0, ah = H - top - bottom;
        F.portrait = ah > aw * 1.2;
        FG.u = F.portrait ? Math.min(aw / 2 / 0.48, ah / 2 / 0.8) : Math.min(aw / 2 / 0.8, ah / 2 / 0.48);
        FG.cx = x0 + aw / 2; FG.cy = top + ah / 2;
        if (snap) Object.assign(F, FG);
      },
      update(now, dt) {
        VIEW = kit.view(1.8);
        const k = Math.min(1, dt * 4);
        for (const key of ['cx', 'cy', 'u']) F[key] += (FG[key] - F[key]) * k;
      },
      draw(now, dt) {
        const beat = now / SPB;
        drawBackground(now, beat, kit.pulse(beat, kickBar(Math.floor(beat / 4))));
        drawRipples(now);
        drawNotes(now);
        drawEffects(dt);
        drawAim(now, dt);
        if (kit.playing()) drawPopups(now);
      },
      onJudge(n, grade, now) {
        const [x, y] = notePos(n, now);
        popups.push({ grade, t: now, x, y });
        if (popups.length > 6) popups.shift();
        if (grade !== 'miss') burst(x, y, HUES[n.drop.hue], grade === 'perfect' ? 1 : 0.6);
      },
      onNewRun() { particles.length = 0; rings.length = 0; popups = []; autoAim.x = F.cx; autoAim.y = F.cy; },
    };
  });

  // ---------------------------------------------------------------------
  //  FURIKO: pendulum. The judgement line is a metronome arm swinging
  //  over a fan of four bands; it is slow at the ends, fast in the middle.
  // ---------------------------------------------------------------------
  defineMode((kit) => {
    const { g, rgba, hex, S, TAU, DEG } = kit;
    const BPM = 126, SPB = 60 / BPM;
    const theme = { ink: '#120c08', ink2: '#2a1a10', panel: 'rgba(18, 12, 8, 0.86)', paper: '#f6eee0', muted: '#b8a58e', accent: '#dcb66a' };
    const INK = hex(theme.ink), INK2 = hex(theme.ink2), PAPER = hex(theme.paper), MUTED = hex(theme.muted), BRASS = hex(theme.accent);
    // Bands from the pivot outward.
    const BANDS = [
      { label: 'D', name: '内側・朱', color: '#ff6a4d' },
      { label: 'F', name: '黄土', color: '#e8b04a' },
      { label: 'J', name: '青竹', color: '#4fc9a6' },
      { label: 'K', name: '外側・藍', color: '#7c95ff' },
    ].map((b) => ({ ...b, rgb: hex(b.color) }));
    const SECTIONS = [
      { bar: 0, name: 'INTRO' }, { bar: 4, name: 'VERSE' }, { bar: 12, name: 'BUILD' }, { bar: 20, name: 'CHORUS' },
      { bar: 28, name: 'BREAK' }, { bar: 32, name: 'CHORUS II' }, { bar: 40, name: 'OUTRO' },
    ];
    // How the arm swings: [bar, beats per swing (one side to the other), amplitude in degrees].
    // The arm crosses the centre on every whole swing count and turns around halfway between.
    const SWINGS = [[0, 2, 35], [4, 2, 55], [12, 2, 60], [16, 1, 45], [20, 1, 65], [28, 4, 70], [32, 1, 70], [40, 2, 40]];
    const segs = [];
    {
      let ph = 0;
      SWINGS.forEach(([bar, per, amp], i) => {
        const b0 = bar * 4;
        if (i > 0) ph += (b0 - segs[i - 1].b0) / segs[i - 1].per;
        segs.push({ b0, per, amp, ph0: ph });
      });
    }
    const segAt = (beat) => { let s = segs[0]; for (const x of segs) if (x.b0 <= beat) s = x; return s; };
    const phaseAt = (beat) => { const s = segAt(beat); return s.ph0 + (beat - s.b0) / s.per; };
    function beatAtPhase(ph) {
      let s = segs[0];
      for (const x of segs) if (x.ph0 <= ph) s = x;
      return s.b0 + (ph - s.ph0) * s.per;
    }
    function ampAt(beat) {
      const i = segs.indexOf(segAt(beat));
      if (i === 0) return segs[0].amp;
      const k = Math.min(1, (beat - segs[i].b0) / 2);
      const e = 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, k));
      return segs[i - 1].amp + (segs[i].amp - segs[i - 1].amp) * e;
    }
    // CHORUS II tilts the whole metronome slowly from side to side.
    const tiltAt = (beat) => (beat >= 128 && beat < 160 ? 12 * Math.sin((TAU * beat) / 16) : 0);
    const armAngle = (beat) => tiltAt(beat) + ampAt(beat) * Math.sin(Math.PI * phaseAt(beat)); // degrees

    // The shared chart, with each hold moved so it stays inside one swing (the arm sweeps along it in one direction).
    const BARS = kit.std4({
      7: ['....a-------....', '2.3.........2.3.'],
      11: ['....d-------....', '1.0.........1.0.'],
      26: ['..b---..........', '......3.2.3.2...'],
      42: ['....a-------....', '....d-------....'],
    });
    // Bm - G - D - A. Lead pitch per band, low inside to high outside.
    const CHORDS = [
      { pad: [59, 62, 66], bass: 47, lead: [71, 74, 78, 83] },
      { pad: [59, 62, 67], bass: 43, lead: [71, 74, 79, 83] },
      { pad: [57, 62, 66], bass: 38, lead: [69, 74, 78, 81] },
      { pad: [57, 61, 64], bass: 45, lead: [69, 73, 76, 81] },
    ];
    const CHART = kit.parseLanes(BARS, SPB, 4);
    for (const n of CHART) {
      const ph = phaseAt(n.beat), endBeat = n.beat + n.beats;
      // the swing a note belongs to starts at the turnaround just before it
      const swingStart = Math.ceil(ph - 0.5 - 1e-9) - 0.5;
      // a hold sweeps from its head to the next turnaround at the latest
      if (n.dur > 0 && phaseAt(endBeat) > Math.floor(ph - 0.5 + 1e-9) + 1.5 + 1e-9) console.warn(`furiko: bar ${n.bar} step ${n.step}: hold crosses a turnaround`);
      n.atTurn = Math.abs(ph - 0.5 - Math.round(ph - 0.5)) < 1e-6;
      n.ang = armAngle(n.beat); n.angEnd = armAngle(endBeat);
      n.show = beatAtPhase(swingStart) * SPB; n.ghost = beatAtPhase(swingStart - 1) * SPB;
    }
    kit.sortChart(CHART);
    const kickBar = (bar) => { const n = SECTIONS[kit.secIndex(SECTIONS, bar)].name; return (n !== 'INTRO' && n !== 'BREAK') || bar === 31; };

    // ----- layout -----
    let W = 0, H = 0;
    // pivot, arm length, and the direction the arm points at rest (up on wide screens, right on tall ones)
    const M = { px: 0, py: 0, len: 1, base: -90 }, MG = { px: 0, py: 0, len: 1, base: -90 };
    const BAND_IN = 0.36, BAND_W = 0.16, BAND_GAP = 0.005;
    const bandR = (i) => [M.len * (BAND_IN + i * BAND_W + BAND_GAP), M.len * (BAND_IN + (i + 1) * BAND_W - BAND_GAP)];
    const dirOf = (deg) => { const a = (M.base + deg) * DEG; return [Math.cos(a), Math.sin(a)]; };
    const at = (deg, r) => { const [dx, dy] = dirOf(deg); return [M.px + dx * r, M.py + dy * r]; };
    function sectorPath(a0, a1, r0, r1) {
      const s = (M.base + Math.min(a0, a1)) * DEG, e = (M.base + Math.max(a0, a1)) * DEG;
      g.beginPath();
      g.arc(M.px, M.py, r1, s, e);
      g.arc(M.px, M.py, r0, e, s, true);
      g.closePath();
    }

    // ----- effects -----
    const particles = [], rings = [];
    function burst(x, y, col, power) {
      rings.push({ x, y, col, life: 0, max: 0.35 });
      const n = kit.reduceMotion ? 4 : Math.round(14 * power);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * TAU, v = (90 + Math.random() * 240) * power;
        particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 0.3 + Math.random() * 0.35, col, size: 1.3 + Math.random() * 2.2 });
      }
    }
    function drawEffects(dt) {
      g.globalCompositeOperation = 'lighter';
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i]; r.life += dt;
        if (r.life > r.max) { rings.splice(i, 1); continue; }
        const u = r.life / r.max;
        g.strokeStyle = rgba(r.col, 0.8 * (1 - u)); g.lineWidth = 2.5 * (1 - u) + 0.8;
        g.beginPath(); g.arc(r.x, r.y, M.len * BAND_W * (0.3 + u * 0.9), 0, TAU); g.stroke();
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.life += dt;
        if (p.life > p.max) { particles.splice(i, 1); continue; }
        p.vx *= 1 - dt * 2.5; p.vy *= 1 - dt * 2.5;
        p.x += p.vx * dt; p.y += p.vy * dt;
        g.fillStyle = rgba(p.col, 1 - p.life / p.max);
        g.beginPath(); g.arc(p.x, p.y, p.size, 0, TAU); g.fill();
      }
      g.globalCompositeOperation = 'source-over';
    }
    function drawBackground(pulse) {
      const bg = g.createRadialGradient(M.px, M.py, 0, M.px, M.py, Math.max(W, H));
      bg.addColorStop(0, rgba(INK2, 1)); bg.addColorStop(1, rgba(INK, 1));
      g.fillStyle = bg; g.fillRect(0, 0, W, H);
      const glow = g.createRadialGradient(M.px, M.py, 0, M.px, M.py, M.len * 1.1);
      glow.addColorStop(0, rgba(BRASS, 0.1 + 0.08 * pulse)); glow.addColorStop(1, rgba(BRASS, 0));
      g.fillStyle = glow; g.fillRect(0, 0, W, H);
    }
    function drawFan(beat, now) {
      const amp = ampAt(beat), tilt = tiltAt(beat);
      const a0 = tilt - amp - 6, a1 = tilt + amp + 6;
      for (let i = 0; i < 4; i++) {
        const [r0, r1] = bandR(i), col = BANDS[i].rgb;
        sectorPath(a0, a1, r0, r1);
        g.fillStyle = rgba(col, 0.07); g.fill();
        g.strokeStyle = rgba(col, 0.28); g.lineWidth = 1; g.stroke();
        // key letters just past both ends of each band
        const down = S.pressed[i] || S.autoHold[i] > now;
        g.font = `${Math.round(Math.max(13, (r1 - r0) * 0.5))}px "Dela Gothic One", sans-serif`;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillStyle = down ? rgba(col, 1) : rgba(PAPER, 0.75);
        for (const side of [a0 - 5, a1 + 5]) { const [x, y] = at(side, (r0 + r1) / 2); g.fillText(BANDS[i].label, x, y); }
      }
      // scale ticks around the outside, like a metronome face
      g.strokeStyle = rgba(PAPER, 0.18); g.lineWidth = 1;
      const rOut = M.len * (BAND_IN + 4 * BAND_W);
      for (let a = -80; a <= 80; a += 10) {
        const [x0, y0] = at(a + tilt, rOut + 4), [x1, y1] = at(a + tilt, rOut + (a % 30 === 0 ? 14 : 9));
        g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
      }
    }
    function drawNotes(now) {
      const chords = [];
      g.lineJoin = 'round';
      for (let i = S.notes.length - 1; i >= 0; i--) {
        const n = S.notes[i];
        if (now < n.ghost || n.end < now - 0.05) continue;
        const live = now >= n.show;
        const [r0, r1] = bandR(n.lane), col = BANDS[n.lane].rgb;
        const mid = (r0 + r1) / 2;
        const holding = kit.holding(n);
        if (n.dur > 0 && n.tail === null && n.head !== 'miss') {
          // hold: the stretch of band the arm will sweep while you keep holding.
          // A hold whose head sits at a turnaround lies behind the arm on the way in, so its body
          // stays an outline until the arm reaches the head and turns back over it.
          const from = holding ? armAngle(now / SPB) : n.ang;
          const solid = live && (!n.atTurn || now >= n.t - 0.06);
          sectorPath(from, n.angEnd, r0 + 3, r1 - 3);
          g.fillStyle = rgba(col, solid ? (holding ? 0.55 : 0.38) : 0.1); g.fill();
          g.strokeStyle = rgba(col, solid ? 0.9 : 0.35); g.lineWidth = 1.5; g.stroke();
        }
        if (n.head) continue;
        // a tick lying along the arm's direction; bright for this swing, an outline for the next
        const half = Math.max(1.2, (7 / mid) / DEG);
        if (n.chord && live) { const [cx, cy] = at(n.ang, mid); chords.push({ t: n.t, x: cx, y: cy }); }
        sectorPath(n.ang - half, n.ang + half, r0 + 2, r1 - 2);
        if (live) {
          const k = Math.max(0, 1 - (n.t - now) / 0.8);
          g.globalCompositeOperation = 'lighter';
          g.strokeStyle = rgba(col, 0.25 + 0.35 * k); g.lineWidth = 8; g.stroke();
          g.globalCompositeOperation = 'source-over';
          g.fillStyle = rgba(col, 1); g.fill();
          g.strokeStyle = rgba(PAPER, 0.8); g.lineWidth = 1.2; g.stroke();
        } else {
          g.strokeStyle = rgba(col, 0.45); g.lineWidth = 1.5; g.stroke();
        }
      }
      kit.chordLines(chords, PAPER);
    }
    function drawArm(now) {
      const beat = now / SPB, ang = armAngle(beat);
      const rTip = M.len * (BAND_IN + 4 * BAND_W) + 18;
      // motion blur: where the arm just was
      g.globalCompositeOperation = 'lighter';
      for (let k = 1; k <= 8; k++) {
        const a = armAngle((now - k * 0.012) / SPB);
        const [x, y] = at(a, rTip);
        g.strokeStyle = rgba(BRASS, 0.07 * (1 - k / 9)); g.lineWidth = 6;
        g.beginPath(); g.moveTo(M.px, M.py); g.lineTo(x, y); g.stroke();
      }
      g.globalCompositeOperation = 'source-over';
      // band crossings light up when pressed
      for (let i = 0; i < 4; i++) {
        const [r0, r1] = bandR(i), col = BANDS[i].rgb;
        const down = S.pressed[i] || S.autoHold[i] > now;
        if (!down && S.flash[i] <= 0) continue;
        const [x0, y0] = at(ang, r0), [x1, y1] = at(ang, r1);
        g.globalCompositeOperation = 'lighter';
        g.strokeStyle = rgba(col, 0.35 + 0.5 * S.flash[i]); g.lineWidth = 20; g.lineCap = 'round';
        g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
        g.globalCompositeOperation = 'source-over';
      }
      const [tx, ty] = at(ang, rTip);
      g.lineCap = 'round';
      g.strokeStyle = rgba(BRASS, 0.35); g.lineWidth = 12;
      g.beginPath(); g.moveTo(M.px, M.py); g.lineTo(tx, ty); g.stroke();
      g.strokeStyle = rgba(BRASS, 1); g.lineWidth = 4;
      g.beginPath(); g.moveTo(M.px, M.py); g.lineTo(tx, ty); g.stroke();
      g.strokeStyle = rgba(PAPER, 0.9); g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(M.px, M.py); g.lineTo(tx, ty); g.stroke();
      // the sliding weight: higher up the arm means a slower swing, as on a real metronome
      const per = segAt(beat).per;
      const wr = M.len * (0.12 + 0.055 * per);
      const [wx, wy] = at(ang, wr), [dx, dy] = dirOf(ang);
      const nx = -dy, ny = dx, ww = M.len * 0.045, wh = M.len * 0.035;
      g.fillStyle = rgba(BRASS, 1);
      g.beginPath();
      g.moveTo(wx + nx * ww - dx * wh, wy + ny * ww - dy * wh);
      g.lineTo(wx + nx * ww * 0.7 + dx * wh, wy + ny * ww * 0.7 + dy * wh);
      g.lineTo(wx - nx * ww * 0.7 + dx * wh, wy - ny * ww * 0.7 + dy * wh);
      g.lineTo(wx - nx * ww - dx * wh, wy - ny * ww - dy * wh);
      g.closePath(); g.fill();
      g.fillStyle = rgba(INK, 0.6);
      g.beginPath(); g.arc(wx, wy, 2.2, 0, TAU); g.fill();
      g.fillStyle = rgba(BRASS, 1);
      g.beginPath(); g.arc(M.px, M.py, 9, 0, TAU); g.fill();
      g.fillStyle = rgba(INK, 0.8);
      g.beginPath(); g.arc(M.px, M.py, 3.5, 0, TAU); g.fill();
    }
    const GRADE_COLOR = { perfect: PAPER, great: BANDS[1].rgb, good: BANDS[2].rgb, miss: MUTED };
    function drawPopup(now) {
      if (!S.popup || now - S.popup.t > 0.5) return;
      const age = now - S.popup.t;
      const k = 1 + 0.25 * Math.max(0, 1 - age * 8);
      const [x, y] = M.base === -90 ? [M.px, M.py - M.len * 0.2] : [M.px + M.len * 0.2, M.py - M.len * 0.1];
      g.save();
      g.translate(x, y); g.scale(k, k);
      g.globalAlpha = Math.min(1, (0.5 - age) * 5);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = '18px "Dela Gothic One", sans-serif';
      g.fillStyle = rgba(GRADE_COLOR[S.popup.grade], 1);
      g.fillText(S.popup.grade.toUpperCase(), 0, 0);
      g.restore();
    }

    return {
      id: 'furiko', name: 'FURIKO', kind: '振り子判定線', kana: 'メトロノーム ・ 振り子判定線',
      blurb: '判定線はメトロノームの振り子。端でゆっくり、真ん中で速く動く振り子が扇形の帯を掃く。',
      lede: '判定線は<strong>メトロノームの振り子</strong>です。扇形に並んだ4本の帯の上にノーツが置いてあり、振り子が通過した瞬間に、その帯のキーを押します。振り子は<strong>端でゆっくり、真ん中で速く</strong>動きます。',
      keys: BANDS.map((b) => ({ label: b.label, name: b.name, color: b.color })),
      titleColors: [theme.accent], hasSpeed: false,
      touchHint: 'スマホは帯をタップ',
      meta: 'BPM 126 ・ 44小節 ・ 約1分25秒 ・ 今のひと振りで当たるノーツははっきり、次のひと振りのノーツは輪郭だけで表示されます。',
      theme, attractFromBar: 20,
      bpm: BPM, bars: 44, sections: SECTIONS, chords: CHORDS, chart: CHART,
      laneCodes: [['KeyD'], ['KeyF'], ['KeyJ'], ['KeyK']],
      // distance from the pivot picks the band
      touchLane(x, y) {
        const r = Math.hypot(x - M.px, y - M.py) / M.len;
        return Math.max(0, Math.min(3, Math.floor((r - BAND_IN) / BAND_W)));
      },
      hudExtra: (beat) => `ひと振り ${segAt(beat).per} 拍`,
      song: {
        bass: { wave: 'sawtooth', subShift: -12, q: 3, open: 900, close: 220 },
        pad: { wave: 'triangle', cutoff: 1000, level: 0.045, detune: 7 },
        delay: null, leadLevel: 0.5, leadSend: 0.3, padBus: 0.8,
        leadMidi: (n) => CHORDS[Math.floor(n.beat / 4) % 4].lead[n.lane],
        // Harpsichord-like pluck: bright saw and square through a filter that closes fast.
        lead(A, at, midi, dur) {
          const { ac } = A, f0 = A.mtof(midi);
          const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 2;
          f.frequency.setValueAtTime(6000, at); f.frequency.exponentialRampToValueAtTime(1400, at + 0.25);
          const gn = ac.createGain();
          gn.gain.setValueAtTime(0.0001, at); gn.gain.exponentialRampToValueAtTime(0.2, at + 0.002);
          if (dur < 0.3) gn.gain.exponentialRampToValueAtTime(0.0001, at + 0.5);
          else { gn.gain.exponentialRampToValueAtTime(0.08, at + 0.25); gn.gain.setValueAtTime(0.08, at + dur); gn.gain.exponentialRampToValueAtTime(0.0001, at + dur + 0.3); }
          const end = at + Math.max(0.55, dur + 0.35);
          const o1 = ac.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = f0;
          const o2 = ac.createOscillator(); o2.type = 'square'; o2.frequency.value = f0 * 2; o2.detune.value = 4;
          const g2 = ac.createGain(); g2.gain.value = 0.3;
          o1.connect(f); o2.connect(g2).connect(f); f.connect(gn).connect(A.bus.lead);
          o1.start(at); o2.start(at); o1.stop(end); o2.stop(end);
        },
        arrange(add, bar, b0, ch, name) {
          if (name === 'VERSE') {
            for (let i = 0; i < 4; i++) { add(b0 + i, 'kick'); add(b0 + i + 0.5, 'hat', false); add(b0 + i + 0.5, 'bass', ch.bass, SPB * 0.45); }
          } else if (name === 'BUILD') {
