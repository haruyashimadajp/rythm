            for (let i = 0; i < 4; i++) { add(b0 + i, 'kick'); add(b0 + i + 0.5, 'bass', ch.bass, SPB * 0.45); }
            for (let i = 0; i < 8; i++) add(b0 + i / 2, 'hat', false);
            if (bar === 19) for (let i = 8; i < 16; i++) add(b0 + i / 4, 'snare');
            else { add(b0 + 1, 'snare'); add(b0 + 3, 'snare'); }
          } else if (name === 'CHORUS' || name === 'CHORUS II') {
            if (bar % 4 === 0) add(b0, 'crash');
            for (let i = 0; i < 4; i++) {
              add(b0 + i, 'kick');
              add(b0 + i, 'bass', ch.bass, SPB * 0.45); add(b0 + i + 0.5, 'bass', ch.bass + 12, SPB * 0.45);
              add(b0 + i + 0.5, 'hat', true);
            }
            add(b0 + 1, 'snare'); add(b0 + 3, 'snare');
          } else if (name === 'BREAK') {
            add(b0, 'bass', ch.bass, SPB * 3.5);
            if (bar === 31) { for (let i = 0; i < 4; i++) add(b0 + i, 'kick'); for (let i = 8; i < 16; i++) add(b0 + i / 4, 'snare'); }
          } else if (name === 'OUTRO') {
            if (bar === 40) add(b0, 'crash');
            if (bar <= 41) { add(b0, 'kick'); add(b0 + 2, 'kick'); }
            if (bar === 42) add(b0, 'bass', ch.bass, SPB * 4);
          }
        },
        // the metronome itself clicks at each turnaround
        extra(add) {
          const lastPh = phaseAt(44 * 4);
          for (let k = 0.5; k < lastPh; k += 1) add(beatAtPhase(k), 'tock', Math.round(k - 0.5) % 2 === 0);
        },
      },
      layout(w, h, snap) {
        W = w; H = h;
        const reach = Math.sin(82 * DEG);
        let x0 = 20;
        const x1 = W - 20;
        if (kit.wide()) x0 = Math.max(W * 0.42, 560);
        const aw = x1 - x0;
        if (H > aw * 1.2) {
          // tall screen: the metronome lies on its side, pivot at the left edge
          MG.base = 0; MG.px = x0 + 14; MG.py = H * 0.52;
          MG.len = Math.min(aw * 0.92, (H * 0.42) / reach);
        } else {
          MG.base = -90; MG.px = x0 + aw / 2; MG.py = H * 0.88;
          MG.len = Math.min(H * 0.76, (aw / 2 - 10) / reach);
        }
        if (snap) Object.assign(M, MG);
      },
      update(now, dt) {
        const k = Math.min(1, dt * 4);
        for (const key of ['px', 'py', 'len']) M[key] += (MG[key] - M[key]) * k;
        M.base = MG.base;
      },
      draw(now, dt) {
        const beat = now / SPB;
        drawBackground(kit.pulse(beat, kickBar(Math.floor(beat / 4))));
        drawFan(beat, now);
        drawNotes(now);
        drawArm(now);
        drawEffects(dt);
        if (kit.playing()) drawPopup(now);
      },
      onJudge(n, grade, now) {
        if (grade === 'miss') return;
        const [r0, r1] = bandR(n.lane);
        const [x, y] = at(armAngle(now / SPB), (r0 + r1) / 2);
        burst(x, y, BANDS[n.lane].rgb, grade === 'perfect' ? 1 : 0.6);
        S.flash[n.lane] = 1;
      },
      onNewRun() { particles.length = 0; rings.length = 0; },
    };
  });

  // ---------------------------------------------------------------------
  //  HASAMI: closing lines. Two blades close in from both sides (often
  //  turning as they go); strike as they meet. Four zones, one key each.
  // ---------------------------------------------------------------------
  defineMode((kit) => {
    const { g, rgba, hex, S, DEG } = kit;
    const BPM = 136, SPB = 60 / BPM;
    const theme = { ink: '#0b0b0e', ink2: '#19181f', panel: 'rgba(11, 11, 14, 0.86)', paper: '#f4f2ee', muted: '#a7a3ad', accent: '#ffc94d' };
    const INK = hex(theme.ink), INK2 = hex(theme.ink2), PAPER = hex(theme.paper), MUTED = hex(theme.muted);
    const ZONES = [
      { label: 'D', name: '紅', color: '#ff4f6e' },
      { label: 'F', name: '金', color: '#ffc94d' },
      { label: 'J', name: '翠', color: '#3ee0a0' },
      { label: 'K', name: '瑠璃', color: '#4f8dff' },
    ].map((z) => ({ ...z, rgb: hex(z.color) }));
    const ZONE_X = [-0.6, -0.2, 0.2, 0.6]; // zone centres in field units
    // How the blades behave in each section: how far apart they start, how much they turn
    // while closing, and which final angles they may take.
    const SECTIONS = [
      { bar: 0, name: 'INTRO', gap: 0.26, spin: 0, angles: [0] },
      { bar: 4, name: 'VERSE', gap: 0.28, spin: 0, angles: [0, 90] },
      { bar: 12, name: 'BUILD', gap: 0.3, spin: 45, angles: [45, 135, 0] },
      { bar: 20, name: 'CHORUS', gap: 0.32, spin: 90, angles: [0, 45, 90, 135] },
      { bar: 28, name: 'BREAK', gap: 0.4, spin: 30, angles: [0, 90] },
      { bar: 32, name: 'CHORUS II', gap: 0.32, spin: 180, angles: [0, 45, 90, 135] },
      { bar: 40, name: 'OUTRO', gap: 0.26, spin: 0, angles: [0] },
    ];
    const BARS = kit.std4();
    // Cm - Ab - Eb - Bb. Lead pitch per zone.
    const CHORDS = [
      { pad: [55, 60, 63], bass: 36, lead: [67, 72, 75, 79] },
      { pad: [56, 60, 63], bass: 44, lead: [68, 72, 75, 80] },
      { pad: [55, 58, 63], bass: 39, lead: [67, 70, 75, 79] },
      { pad: [53, 58, 62], bass: 46, lead: [65, 70, 74, 77] },
    ];
    // Each note gets its pair of blades. Inside a zone, notes sit higher the earlier they come in the
    // bar, so time reads top to bottom and a stair pattern across the zones reads as a diagonal.
    // All blades in a bar share one final angle, and the turning direction alternates bar by bar.
    const CHART = kit.parseLanes(BARS, SPB, 4);
    for (const n of CHART) {
      const sec = SECTIONS[kit.secIndex(SECTIONS, n.bar)];
      n.x = ZONE_X[n.lane];
      n.y = -0.34 + 0.68 * (n.step / 15);
      n.ang = sec.angles[n.bar % sec.angles.length];
      n.spin = sec.spin * (n.bar % 2 ? -1 : 1);
      n.gap = sec.gap;
    }
    kit.sortChart(CHART);
    const kickBar = (bar) => { const n = SECTIONS[kit.secIndex(SECTIONS, bar)].name; return (n !== 'INTRO' && n !== 'BREAK') || bar === 31; };

    // ----- layout -----
    let W = 0, H = 0, VIEW = 1.3, shake = 0;
    const F = { cx: 0, cy: 0, u: 1, portrait: false }, FG = { cx: 0, cy: 0, u: 1 };
    // field units -> screen. On tall screens the zones stack top to bottom.
    const toScreen = (x, y) => (F.portrait ? [F.cx - y * F.u, F.cy + x * F.u] : [F.cx + x * F.u, F.cy + y * F.u]);
    const screenAngle = (deg) => (F.portrait ? deg + 90 : deg);
    // The two blades of a note at time now: centre, line direction, normal, half-gap and half-length (pixels).
    const BLADE = 0.3;
    function blades(n, now) {
      const s = Math.max(0, (n.t - now) / VIEW);
      const a = (screenAngle(n.ang) + n.spin * s) * DEG;
      const ux = Math.cos(a), uy = Math.sin(a), nx = -uy, ny = ux;
      // sideways travel is squeezed so the blades stay near their zone
      const across = Math.abs(F.portrait ? ny : nx);
      const gap = n.gap * (1 - 0.45 * across) * s * F.u;
      const [cx, cy] = toScreen(n.x, n.y);
      return { cx, cy, ux, uy, nx, ny, gap, half: (BLADE * F.u) / 2, s };
    }

    // ----- effects -----
    const particles = [], cuts = [];
    // a bright slash where the blades met, with sparks thrown out to both sides
    function cut(b, col, power) {
      cuts.push({ ...b, col, life: 0, max: 0.4 });
      const n = kit.reduceMotion ? 4 : Math.round(20 * power);
      for (let i = 0; i < n; i++) {
        const along = (Math.random() - 0.5) * 2 * b.half, side = Math.random() < 0.5 ? -1 : 1;
        const v = (140 + Math.random() * 320) * power, spread = (Math.random() - 0.5) * 0.8;
        particles.push({
          x: b.cx + b.ux * along, y: b.cy + b.uy * along,
          vx: (b.nx * side + b.ux * spread) * v, vy: (b.ny * side + b.uy * spread) * v,
          life: 0, max: 0.25 + Math.random() * 0.3, col, size: 1.2 + Math.random() * 2,
        });
      }
    }
    function drawEffects(dt) {
      g.globalCompositeOperation = 'lighter';
      g.lineCap = 'round';
      for (let i = cuts.length - 1; i >= 0; i--) {
        const c = cuts[i]; c.life += dt;
        if (c.life > c.max) { cuts.splice(i, 1); continue; }
        const u = c.life / c.max, ext = c.half * (1 + u * 0.5);
        g.strokeStyle = rgba(c.col, 0.7 * (1 - u)); g.lineWidth = 16 * (1 - u) + 2;
        g.beginPath(); g.moveTo(c.cx - c.ux * ext, c.cy - c.uy * ext); g.lineTo(c.cx + c.ux * ext, c.cy + c.uy * ext); g.stroke();
        g.strokeStyle = rgba(PAPER, 0.9 * (1 - u)); g.lineWidth = 3 * (1 - u) + 0.5; g.stroke();
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.life += dt;
        if (p.life > p.max) { particles.splice(i, 1); continue; }
        p.vx *= 1 - dt * 3; p.vy *= 1 - dt * 3;
        p.x += p.vx * dt; p.y += p.vy * dt;
        g.strokeStyle = rgba(p.col, 1 - p.life / p.max); g.lineWidth = p.size;
        g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx * 0.02, p.y - p.vy * 0.02); g.stroke();
      }
      g.globalCompositeOperation = 'source-over';
    }
    function drawBackground(pulse, now) {
      const bg = g.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, rgba(INK, 1)); bg.addColorStop(1, rgba(INK2, 1));
      g.fillStyle = bg; g.fillRect(0, 0, W, H);
      // the four zones: faint bands, lit while their key is down
      const zw = 0.4 * F.u, zh = 1.0 * F.u;
      for (let z = 0; z < 4; z++) {
        const [x, y] = toScreen(ZONE_X[z], 0), col = ZONES[z].rgb;
        const down = S.pressed[z] || S.autoHold[z] > now;
        const w = F.portrait ? zh : zw - 6, h = F.portrait ? zw - 6 : zh;
        g.fillStyle = rgba(col, 0.025 + 0.02 * pulse + (down ? 0.06 : 0) + 0.06 * S.flash[z]);
        g.fillRect(x - w / 2, y - h / 2, w, h);
        g.strokeStyle = rgba(col, 0.12); g.lineWidth = 1;
        g.strokeRect(x - w / 2, y - h / 2, w, h);
        // key letter just outside the zone
        const [lx, ly] = F.portrait ? [x - w / 2 + 16, y - h / 2 + 18] : [x, y + h / 2 + 22];
        g.fillStyle = down ? rgba(col, 1) : rgba(PAPER, 0.7);
        g.font = '18px "Dela Gothic One", sans-serif';
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(ZONES[z].label, lx, ly);
      }
    }
    function drawBlades(now) {
      const chords = [];
      g.lineCap = 'round';
      for (let i = S.notes.length - 1; i >= 0; i--) {
        const n = S.notes[i];
        if (n.t - now > VIEW || n.end < now - 0.05) continue;
        const col = ZONES[n.lane].rgb;
        const b = blades(n, now);
        const appear = Math.min(1, (VIEW - (n.t - now)) / 0.2);
        const holding = kit.holding(n);
        if (n.dur > 0 && n.head && n.tail === null && n.head !== 'miss') {
          // hold: the closed seam stays lit while a bead runs along it
          const k = Math.min(1, Math.max(0, (now - n.t) / n.dur));
          const f = blades(n, n.t);
          const ax = f.cx - f.ux * f.half, ay = f.cy - f.uy * f.half, bx = f.cx + f.ux * f.half, by = f.cy + f.uy * f.half;
          g.globalCompositeOperation = 'lighter';
          g.strokeStyle = rgba(col, holding ? 0.45 : 0.2); g.lineWidth = 12;
          g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
          g.globalCompositeOperation = 'source-over';
          g.strokeStyle = rgba(PAPER, 0.85); g.lineWidth = 2;
          g.beginPath(); g.moveTo(ax, ay); g.lineTo(ax + (bx - ax) * k, ay + (by - ay) * k); g.stroke();
          g.fillStyle = rgba(PAPER, 1);
          g.beginPath(); g.arc(ax + (bx - ax) * k, ay + (by - ay) * k, 5, 0, Math.PI * 2); g.fill();
          continue;
        }
        if (n.head) continue;
        // where the blades will meet, and at what angle
        const f = blades(n, n.t);
        if (n.chord) chords.push({ t: n.t, x: f.cx, y: f.cy, a: appear });
        g.setLineDash([3, 6]);
        g.strokeStyle = rgba(col, 0.3 * appear); g.lineWidth = 1.2;
        g.beginPath(); g.moveTo(f.cx - f.ux * f.half, f.cy - f.uy * f.half); g.lineTo(f.cx + f.ux * f.half, f.cy + f.uy * f.half); g.stroke();
        g.setLineDash([]);
        // the closing gap between the blades
        const p = (side, along) => [b.cx + b.nx * b.gap * side + b.ux * along, b.cy + b.ny * b.gap * side + b.uy * along];
        const c1 = p(1, -b.half), c2 = p(1, b.half), c3 = p(-1, b.half), c4 = p(-1, -b.half);
        g.fillStyle = rgba(col, (0.05 + 0.18 * (1 - b.s)) * appear);
        g.beginPath(); g.moveTo(c1[0], c1[1]); g.lineTo(c2[0], c2[1]); g.lineTo(c3[0], c3[1]); g.lineTo(c4[0], c4[1]); g.closePath(); g.fill();
        for (const [a0, a1] of [[c1, c2], [c4, c3]]) {
          g.beginPath(); g.moveTo(a0[0], a0[1]); g.lineTo(a1[0], a1[1]);
          g.globalCompositeOperation = 'lighter';
          g.strokeStyle = rgba(col, 0.3 * appear); g.lineWidth = 10; g.stroke();
          g.globalCompositeOperation = 'source-over';
          g.strokeStyle = rgba(col, appear); g.lineWidth = 4; g.stroke();
          g.strokeStyle = rgba(PAPER, 0.75 * appear); g.lineWidth = 1.2; g.stroke();
        }
      }
      kit.chordLines(chords, PAPER);
    }
    const GRADE_COLOR = { perfect: PAPER, great: ZONES[1].rgb, good: ZONES[2].rgb, miss: MUTED };
    function drawPopup(now) {
      if (!S.popup || now - S.popup.t > 0.5) return;
      const age = now - S.popup.t;
      const [x, y] = toScreen(S.popup.n.x, S.popup.n.y);
      g.save();
      g.translate(x, y - 34 - age * 24);
      g.globalAlpha = Math.min(1, (0.5 - age) * 5);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = '15px "Dela Gothic One", sans-serif';
      g.fillStyle = rgba(GRADE_COLOR[S.popup.grade], 1);
      g.fillText(S.popup.grade.toUpperCase(), 0, 0);
      g.restore();
    }

    return {
      id: 'hasami', name: 'HASAMI', kind: '閉じる2本線', kana: '挟み ・ 閉じる2本線',
      blurb: '2本の刃のような線が両側から近づき、ぴったり重なった瞬間に叩く。回転しながら閉じることも。',
      lede: '2本の刃のような線が両側から近づき、<strong>ぴったり重なった瞬間</strong>にキーを押します。線は回転しながら閉じることもあります。画面は4つの区画に分かれていて、区画ごとにキーが決まっています。',
      keys: ZONES.map((z) => ({ label: z.label, name: z.name, color: z.color })),
      touchHint: 'スマホは区画をタップ',
      meta: 'BPM 136 ・ 44小節 ・ 約1分20秒 ・ 点線は、2本の線が重なる位置と角度です。',
      theme, attractFromBar: 20,
      bpm: BPM, bars: 44, sections: SECTIONS, chords: CHORDS, chart: CHART,
      laneCodes: [['KeyD'], ['KeyF'], ['KeyJ'], ['KeyK']],
      touchLane(x, y) {
        const along = F.portrait ? (y - F.cy) / F.u : (x - F.cx) / F.u;
        return Math.max(0, Math.min(3, Math.floor((along + 0.8) / 0.4)));
      },
      progressColor: () => rgba(PAPER, 0.8),
      song: {
        bass: { wave: 'sawtooth', subShift: 0, q: 8, open: 1800, close: 240 },
        pad: { wave: 'sawtooth', cutoff: 1300, level: 0.045, detune: 10, attack: 0.3 },
        delay: { beats: 0.5, feedback: 0.25, mix: 0.2 }, leadLevel: 0.5, leadSend: 0.3, padBus: 0.8,
        leadMidi: (n) => CHORDS[Math.floor(n.beat / 4) % 4].lead[n.lane],
        // Metallic stab: a square through a snapping filter with a short "shk" of noise on top.
        lead(A, at, midi, dur) {
          const { ac } = A, f0 = A.mtof(midi);
          const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 6;
          f.frequency.setValueAtTime(7000, at); f.frequency.exponentialRampToValueAtTime(1200, at + 0.12);
          const gn = ac.createGain();
          gn.gain.setValueAtTime(0.0001, at); gn.gain.exponentialRampToValueAtTime(0.16, at + 0.002);
          if (dur < 0.3) gn.gain.exponentialRampToValueAtTime(0.0001, at + 0.32);
          else { gn.gain.exponentialRampToValueAtTime(0.07, at + 0.15); gn.gain.setValueAtTime(0.07, at + dur); gn.gain.exponentialRampToValueAtTime(0.0001, at + dur + 0.25); }
          const end = at + Math.max(0.35, dur + 0.3);
          const o1 = ac.createOscillator(); o1.type = 'square'; o1.frequency.value = f0;
          const o2 = ac.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = f0 * 1.5; o2.detune.value = 6;
          const g2 = ac.createGain(); g2.gain.value = 0.25;
          o1.connect(f); o2.connect(g2).connect(f); f.connect(gn).connect(A.bus.lead);
          o1.start(at); o2.start(at); o1.stop(end); o2.stop(end);
          const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000;
          A.noiseSrc(at, 0.05).connect(hp).connect(A.decayGain(at, 0.06, 0.001, 0.03)).connect(A.bus.lead);
        },
        arrange(add, bar, b0, ch, name) {
          if (name === 'INTRO') {
            if (bar >= 2) for (let i = 0; i < 8; i++) add(b0 + i / 2, 'hat', false);
          } else if (name === 'VERSE') {
            for (let i = 0; i < 4; i++) { add(b0 + i, 'kick'); add(b0 + i + 0.5, 'hat', false); }
            for (const s of [0.5, 1.5, 2.5, 3.25, 3.5]) add(b0 + s, 'bass', ch.bass, SPB * 0.3);
          } else if (name === 'BUILD') {
            for (let i = 0; i < 4; i++) { add(b0 + i, 'kick'); add(b0 + i + 0.5, 'bass', ch.bass, SPB * 0.4); }
            for (let i = 0; i < 16; i++) add(b0 + i / 4, 'hat', false);
            if (bar === 19) for (let i = 8; i < 16; i++) add(b0 + i / 4, 'snare');
            else { add(b0 + 1, 'snare'); add(b0 + 3, 'snare'); }
          } else if (name === 'CHORUS' || name === 'CHORUS II') {
            if (bar % 4 === 0) add(b0, 'crash');
            for (let i = 0; i < 4; i++) {
              add(b0 + i, 'kick');
              add(b0 + i + 0.5, 'hat', true);
              add(b0 + i + 0.25, 'hat', false); add(b0 + i + 0.75, 'hat', false);
              add(b0 + i + 0.5, 'bass', ch.bass, SPB * 0.25); add(b0 + i + 0.75, 'bass', ch.bass + 12, SPB * 0.2);
            }
            add(b0 + 1, 'snare'); add(b0 + 3, 'snare');
          } else if (name === 'BREAK') {
            add(b0, 'bass', ch.bass, SPB * 3.5);
            if (bar === 31) { for (let i = 0; i < 4; i++) add(b0 + i, 'kick'); for (let i = 8; i < 16; i++) add(b0 + i / 4, 'snare'); }
          } else if (name === 'OUTRO') {
            if (bar === 40) add(b0, 'crash');
            if (bar <= 41) { add(b0, 'kick'); add(b0 + 2, 'kick'); }
            if (bar === 42) add(b0, 'bass', ch.bass, SPB * 4);
          }
        },
      },
      layout(w, h, snap) {
        W = w; H = h;
        const top = Math.max(70, H * 0.09), bottom = Math.max(56, H * 0.07);
        let x0 = 20;
        const x1 = W - 20;
        if (kit.wide()) x0 = Math.max(W * 0.42, 560);
        const aw = x1 - x0, ah = H - top - bottom;
        F.portrait = ah > aw * 1.2;
        FG.u = F.portrait ? Math.min(aw / 2 / 0.5, ah / 2 / 0.82) : Math.min(aw / 2 / 0.82, ah / 2 / 0.5);
        FG.cx = x0 + aw / 2; FG.cy = top + ah / 2;
        if (snap) Object.assign(F, FG);
      },
      update(now, dt) {
        VIEW = kit.view(1.3);
        const k = Math.min(1, dt * 4);
        for (const key of ['cx', 'cy', 'u']) F[key] += (FG[key] - F[key]) * k;
        shake = Math.max(0, shake - dt * 20);
      },
      draw(now, dt) {
        const beat = now / SPB;
        g.save();
        if (shake > 0) g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        drawBackground(kit.pulse(beat, kickBar(Math.floor(beat / 4))), now);
        drawBlades(now);
        drawEffects(dt);
        g.restore();
        if (kit.playing()) drawPopup(now);
      },
      onJudge(n, grade) {
        if (grade === 'miss') return;
        cut(blades(n, n.t), ZONES[n.lane].rgb, grade === 'perfect' ? 1 : 0.6);
        S.flash[n.lane] = 1;
        if (grade === 'perfect' && !kit.reduceMotion) shake = Math.max(shake, 2.5);
      },
      onNewRun() { particles.length = 0; cuts.length = 0; shake = 0; },
    };
  });

  // ---------------------------------------------------------------------
  //  TOMOSHI: a judgement line you move yourself. Lanterns hang still in
  //  four rows; you sweep a beam of light across with the mouse (or your
  //  finger), and a lantern lights if the beam is on it at its moment.
  //  Nothing to press. The chart is fixed; how you sweep is up to you.
  // ---------------------------------------------------------------------
  defineMode((kit) => {
    const { g, rgba, hex, S, TAU } = kit;
    const BPM = 118, SPB = 60 / BPM;
    const theme = { ink: '#070b1f', ink2: '#1d1433', panel: 'rgba(7, 11, 31, 0.84)', paper: '#fbf3e4', muted: '#b0a6c4', accent: '#ffb43d' };
    const INK = hex(theme.ink), INK2 = hex(theme.ink2), PAPER = hex(theme.paper), MUTED = hex(theme.muted), WARM = hex('#ffd9a0');
    // Rows from the top down; they only set where a lantern hangs, not a key.
    const ROWS = [
      { label: '上', name: '朱', color: '#ff6b4a' },
      { label: '二', name: '山吹', color: '#ffb43d' },
      { label: '三', name: '桃', color: '#ff8fb8' },
      { label: '下', name: '若竹', color: '#8fe08a' },
    ].map((r) => ({ ...r, rgb: hex(r.color) }));
    const SECTIONS = [
      { bar: 0, name: 'INTRO' }, { bar: 4, name: 'VERSE' }, { bar: 12, name: 'BUILD' }, { bar: 20, name: 'CHORUS' },
      { bar: 28, name: 'BREAK' }, { bar: 32, name: 'CHORUS II' }, { bar: 40, name: 'OUTRO' },
    ];
    const BARS = kit.std4();
    // E - C#m - A - B. Lead pitch per row: high at the top.
    const CHORDS = [
      { pad: [52, 56, 59], bass: 40, lead: [76, 71, 68, 64] },
      { pad: [52, 56, 61], bass: 37, lead: [76, 73, 68, 64] },
      { pad: [52, 57, 61], bass: 45, lead: [76, 73, 69, 64] },
      { pad: [54, 59, 63], bass: 47, lead: [78, 75, 71, 66] },
    ];

    // Where the lanterns hang across the field (0 = left, 1 = right) follows a sweep for each
    // section, so there is always a natural way to move the beam; how closely you follow it is yours.
    const tri = (b, p) => { const u = (((b / p) % 1) + 1) % 1; return u < 0.5 ? u * 2 : 2 - u * 2; };
    const PATHS = [
      (b) => 0.1 + 0.8 * tri(b, 8), // INTRO: one slow sweep per two bars
      (b) => 0.1 + 0.8 * tri(b, 4), // VERSE: across and back every bar
      (b) => (b < 64 ? 0.2 + 0.6 * tri(b, 4) : 0.25 + 0.5 * tri(b, 2)), // BUILD: narrower and quicker
      (b) => 0.08 + 0.84 * tri(b, 4), // CHORUS: the full width
      (b) => 0.5 + 0.38 * Math.sin((TAU * b) / 16), // BREAK: a slow swing for the long holds
      (b) => 0.5 + 0.18 * Math.sin((TAU * b) / 32) + 0.28 * (tri(b, 2) * 2 - 1), // CHORUS II: quick sweeps that drift
      (b) => 0.1 + 0.8 * tri(b, 8), // OUTRO
    ];
    function pathX(beat) {
      const i = kit.secIndex(SECTIONS, Math.floor(beat / 4));
      const x = PATHS[i](beat);
      if (i === 0) return x;
      const k = (beat - SECTIONS[i].bar * 4) / 2;
      if (k >= 1) return x;
      const prev = PATHS[i - 1](beat), e = 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, k));
      return prev + (x - prev) * e;
    }
    const CHART = kit.parseLanes(BARS, SPB, 4);
    for (const n of CHART) {
      n.x = pathX(n.beat);
      n.x2 = n.dur > 0 ? pathX(n.beat + n.beats) : n.x;
    }
    kit.sortChart(CHART);
    for (let i = 1; i < CHART.length; i++) {
      const a = CHART[i - 1], b = CHART[i], dt = b.t - (a.t + a.dur);
      if (dt > 0 && Math.abs(b.x - a.x2) / dt > 2.2) console.warn(`tomoshi: beat ${b.beat}: the beam would have to move too fast`);
    }
    const kickBar = (bar) => { const n = SECTIONS[kit.secIndex(SECTIONS, bar)].name; return (n !== 'INTRO' && n !== 'BREAK') || bar === 31; };

    // ----- layout -----
    let W = 0, H = 0, VIEW = 1.6;
    const R = { x: 0, y: 0, w: 1, h: 1 }, RG = { x: 0, y: 0, w: 1, h: 1 };
    const rowGap = () => R.h / 4;
    const lw = () => Math.max(20, Math.min(rowGap() * 0.34, R.w * 0.075));
    const tol = () => lw() * 0.6 + R.w * 0.035;
    const fx = (nx) => R.x + nx * R.w;
    // lanterns hang on wires that sag a little in the middle
    const rowY = (row, nx) => R.y + rowGap() * (row + 0.42) + rowGap() * 0.12 * Math.sin(Math.PI * Math.min(1, Math.max(0, nx)));
    const holdX = (n, t) => n.x + (n.x2 - n.x) * Math.min(1, Math.max(0, (t - n.t) / n.dur));
    const auto = { x: 0 };
    const beamX = () => (S.auto ? auto.x : Math.min(R.x + R.w, Math.max(R.x, S.aim.x)));

    // ----- effects -----
    const sparks = [];
    function burst(x, y, col, power) {
      const n = kit.reduceMotion ? 4 : Math.round(16 * power);
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, v = (60 + Math.random() * 200) * power;
        sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 0.5 + Math.random() * 0.6, col, size: 1.2 + Math.random() * 2 });
      }
    }
    function drawSparks(dt) {
      g.globalCompositeOperation = 'lighter';
      for (let i = sparks.length - 1; i >= 0; i--) {
        const p = sparks[i]; p.life += dt;
        if (p.life > p.max) { sparks.splice(i, 1); continue; }
        p.vx *= 1 - dt * 1.5; p.vy = p.vy * (1 - dt * 1.5) - 20 * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        g.fillStyle = rgba(p.col, 1 - p.life / p.max);
        g.beginPath(); g.arc(p.x, p.y, p.size, 0, TAU); g.fill();
      }
      g.globalCompositeOperation = 'source-over';
    }

    // ----- drawing -----
    const stars = Array.from({ length: kit.reduceMotion ? 0 : 90 }, () => ({ x: Math.random(), y: Math.random() * 0.7, r: 0.6 + Math.random() * 1.2, ph: Math.random() * TAU }));
    function drawBackground(now, pulse) {
      const bg = g.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, rgba(INK, 1)); bg.addColorStop(1, rgba(INK2, 1));
      g.fillStyle = bg; g.fillRect(0, 0, W, H);

    // ----- effects -----
    const particles = [], flashes = [];
    function burst(x, y, col, power) {
      const out = Math.atan2(y - C.y, x - C.x);
      const n = kit.reduceMotion ? 4 : Math.round(18 * power);
      for (let i = 0; i < n; i++) {
        const a = out + (Math.random() - 0.5) * 1.6, v = (200 + Math.random() * 380) * power;
        particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 0.25 + Math.random() * 0.3, col, size: 1.5 + Math.random() * 2.5 });
      }
    }
    function drawEffects(dt) {
      g.globalCompositeOperation = 'lighter';
      for (let i = flashes.length - 1; i >= 0; i--) {
        const f = flashes[i]; f.life += dt;
        if (f.life > 0.3) { flashes.splice(i, 1); continue; }
        const u = f.life / 0.3, a = stripeAng(f.lane, f.t) * DEG;
        g.strokeStyle = rgba(STRIPES[f.lane].rgb, 0.8 * (1 - u)); g.lineWidth = 14 * (1 - u) + 2;
        g.beginPath(); g.arc(C.x, C.y, C.r * (1 + u * 0.08), a - 0.5, a + 0.5); g.stroke();
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.life += dt;
        if (p.life > p.max) { particles.splice(i, 1); continue; }
        p.x += p.vx * dt; p.y += p.vy * dt;
        g.strokeStyle = rgba(p.col, 1 - p.life / p.max); g.lineWidth = p.size;
        g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); g.stroke();
      }
      g.globalCompositeOperation = 'source-over';
    }

    // streaks rushing past along the wall
    const streaks = Array.from({ length: kit.reduceMotion ? 0 : 70 }, () => ({ a: Math.random() * 360, s: Math.random() * 1.2 - 0.2, mul: 0.75 + Math.random() * 0.25 }));
    function drawShaft(now, dt, pulse) {
      const beat = now / SPB, sec = SECTIONS[kit.secIndex(SECTIONS, Math.max(0, Math.floor(beat / 4)))];
      g.fillStyle = rgba(INK, 1); g.fillRect(0, 0, W, H);
      // light far below at the bottom of the shaft
      const [fx, fy, fr] = slice(now + VIEW * 1.2, now);
      const deep = g.createRadialGradient(fx, fy, 0, fx, fy, C.r * 0.9);
      deep.addColorStop(0, rgba(STRIPES[sec.hue].rgb, 0.35 + 0.15 * pulse)); deep.addColorStop(0.25, rgba(INK2, 0.9)); deep.addColorStop(1, rgba(INK, 0));
      g.fillStyle = deep; g.fillRect(0, 0, W, H);
      g.fillStyle = rgba(PAPER, 0.9);
      g.beginPath(); g.arc(fx, fy, Math.max(2, fr * 0.5), 0, TAU); g.fill();
      // rings: one per beat, brighter on the bar, each cut into the four stripe colours
      const b0 = Math.ceil(beat - 0.1 * VIEW / SPB), b1 = Math.ceil(beat + VIEW / SPB * 1.15);
      for (let b = Math.max(0, b0); b <= b1; b++) {
        const t = b * SPB;
        const [x, y, r, k] = slice(t, now);
        if (r < 2) continue;
        const fade = Math.min(1, (1.15 - (t - now) / VIEW) * 3) * Math.min(1, k * 1.2);
        for (let l = 0; l < 4; l++) {
          const a = stripeAng(l, t) * DEG;
          g.strokeStyle = rgba(STRIPES[l].rgb, (b % 4 === 0 ? 0.5 : 0.24) * fade);
          g.lineWidth = Math.max(1, (b % 4 === 0 ? 3 : 1.5) * k);
          g.beginPath(); g.arc(x, y, r, a - Math.PI / 4 + 0.04, a + Math.PI / 4 - 0.04); g.stroke();
        }
      }
      // the stripe borders spiral away down the shaft
      for (let l = 0; l < 4; l++) {
        g.strokeStyle = rgba(PAPER, 0.16); g.lineWidth = 1.2;
        g.beginPath();
        for (let k = 0; k <= 30; k++) {
          const t = now + VIEW * (1.15 * (k / 30));
          const [x, y] = onWall(t, stripeAng(l, t) - 45, now);
          if (k === 0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.stroke();
      }
      g.globalCompositeOperation = 'lighter';
      for (const st of streaks) {
        st.s -= dt * 1.6 / VIEW;
        if (st.s < 0) { st.s = 1.1; st.a = Math.random() * 360; }
        const t0 = now + st.s * VIEW, t1 = now + (st.s + 0.06) * VIEW;
        const [x0, y0] = onWall(t0, st.a, now, st.mul), [x1, y1] = onWall(t1, st.a, now, st.mul);
        g.strokeStyle = rgba(PAPER, 0.18 * Math.min(1, (1.1 - st.s) * 2)); g.lineWidth = 1.2;
        g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
      }
      g.globalCompositeOperation = 'source-over';
    }

    function drawNotes(now) {
      const W2 = 26; // half-width of a note tile, in degrees
      const chords = [];
      for (let i = S.notes.length - 1; i >= 0; i--) {
        const n = S.notes[i];
        if (n.t - now > VIEW * 1.1 || n.end < now - 0.15) continue;
        const col = STRIPES[n.lane].rgb;
        const holding = kit.holding(n);
        if (n.dur > 0 && n.tail === null && n.head !== 'miss') {
          // hold: a ribbon that follows its stripe as it spirals away
          const t0 = holding ? now : n.t, t1 = Math.min(n.end, now + VIEW * 1.1);
          if (t1 > t0) {
            // sides run down the wall along the stripe; both ends are arcs of the shaft wall
            const L = [], Rr = [], hw = W2 * 0.7, steps = 48;
            for (let k = 0; k <= steps; k++) {
              const t = t0 + ((t1 - t0) * k) / steps, c = stripeAng(n.lane, t);
              L.push(onWall(t, c - hw, now, 0.95)); Rr.push(onWall(t, c + hw, now, 0.95));
            }
            const [nx0, ny0, nr0] = slice(t0, now), [fx1, fy1, fr1] = slice(t1, now);
            const c0 = stripeAng(n.lane, t0) * DEG, c1 = stripeAng(n.lane, t1) * DEG, hwr = hw * DEG;
            g.beginPath();
            L.forEach(([x, y], k) => (k ? g.lineTo(x, y) : g.moveTo(x, y)));
            g.arc(fx1, fy1, fr1 * 0.95, c1 - hwr, c1 + hwr);
            for (let k = Rr.length - 1; k >= 0; k--) g.lineTo(Rr[k][0], Rr[k][1]);
            g.arc(nx0, ny0, nr0 * 0.95, c0 + hwr, c0 - hwr, true);
            g.closePath();
            g.fillStyle = rgba(col, holding ? 0.55 : 0.32); g.fill();
            g.strokeStyle = rgba(col, 0.9); g.lineWidth = 1.5; g.stroke();
          }
        }
        if (n.head || n.t < now - 0.15) continue;
        // a glowing tile on the wall, rushing up out of the depths
        const [x, y, r, k] = slice(n.t, now);
        const c = stripeAng(n.lane, n.t) * DEG, w = W2 * DEG;
        const appear = Math.min(1, (VIEW * 1.1 - (n.t - now)) / (VIEW * 0.2));
        if (n.chord) chords.push({ t: n.t, x: x + Math.cos(c) * r * 0.93, y: y + Math.sin(c) * r * 0.93, a: appear });
        g.globalAlpha = appear;
        g.beginPath();
        g.arc(x, y, r, c - w, c + w);
        g.arc(x, y, r * 0.86, c + w, c - w, true);
        g.closePath();
        g.globalCompositeOperation = 'lighter';
        g.strokeStyle = rgba(col, 0.35); g.lineWidth = Math.max(2, 14 * k); g.stroke();
        g.globalCompositeOperation = 'source-over';
        g.fillStyle = rgba(col, 0.95); g.fill();
        g.strokeStyle = rgba(PAPER, 0.85); g.lineWidth = Math.max(1, 2 * k);
        g.beginPath(); g.arc(x, y, r * 0.93, c - w * 0.7, c + w * 0.7); g.stroke();
        g.globalAlpha = 1;
      }
      kit.chordLines(chords, PAPER);
    }

    function drawRim(now) {
      // the rim you are falling past: four arcs in the stripes' colours, wherever they have turned to
      for (let l = 0; l < 4; l++) {
        const col = STRIPES[l].rgb, a = stripeAng(l, now) * DEG;
        const down = S.pressed[l] || S.autoHold[l] > now;
        g.globalCompositeOperation = 'lighter';
        g.strokeStyle = rgba(col, 0.25 + (down ? 0.35 : 0) + 0.4 * S.flash[l]); g.lineWidth = 18;
        g.beginPath(); g.arc(C.x, C.y, C.r, a - Math.PI / 4 + 0.05, a + Math.PI / 4 - 0.05); g.stroke();
        g.globalCompositeOperation = 'source-over';
        g.strokeStyle = rgba(col, 1); g.lineWidth = down ? 7 : 5;
        g.stroke();
        const lx = C.x + Math.cos(a) * (C.r - 30), ly = C.y + Math.sin(a) * (C.r - 30);
        g.fillStyle = down ? rgba(col, 0.6) : rgba(INK, 0.75);
        g.beginPath(); g.arc(lx, ly, 15, 0, TAU); g.fill();
        g.strokeStyle = rgba(col, 1); g.lineWidth = 2; g.stroke();
        g.fillStyle = rgba(PAPER, 0.95);
        g.font = '15px "Dela Gothic One", sans-serif';
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(STRIPES[l].label, lx, ly + 1);
      }
    }

    const GRADE_COLOR = { perfect: PAPER, great: STRIPES[1].rgb, good: STRIPES[2].rgb, miss: MUTED };
    function drawCentre(now) {
      g.textAlign = 'center'; g.textBaseline = 'middle';
      if (S.combo >= 5) {
        g.fillStyle = rgba(PAPER, 0.2);
        g.font = `${Math.round(C.r * 0.2)}px "Dela Gothic One", sans-serif`;
        g.fillText(String(S.combo), C.x, C.y - C.r * 0.3);
      }
      if (S.popup && now - S.popup.t <= 0.5) {
        const age = now - S.popup.t, k = 1 + 0.3 * Math.max(0, 1 - age * 8);
        g.save();
        g.translate(C.x, C.y + C.r * 0.3); g.scale(k, k);
        g.globalAlpha = Math.min(1, (0.5 - age) * 5);
        g.font = `${Math.round(Math.min(26, C.r * 0.07))}px "Dela Gothic One", sans-serif`;
        g.fillStyle = rgba(GRADE_COLOR[S.popup.grade], 1);
        g.fillText(S.popup.grade.toUpperCase(), 0, 0);
        g.restore();
      }
    }

    return {
      id: 'fukami', name: 'FUKAMI', kind: 'ダイブ', kana: '深み ・ ダイブ（奥行き落下）',
      blurb: '光の縦穴を落ちていく。壁を這い上がってくるノーツが縁を通過する瞬間に叩く。壁の色の帯はねじれる。',
      lede: '光の縦穴を真っ逆さまに落ちていきます。ノーツは穴の壁に乗って深みから迫ってきて、<strong>手前の縁を通過する瞬間</strong>に叩きます。壁は4色の帯に分かれていて、キーは帯の色に対応します。帯は落ちるほどねじれ、穴は曲がります。',
      keys: STRIPES.map((s) => ({ label: s.label, name: s.name, color: s.color })),
      touchHint: 'スマホは縁の色の部分をタップ',
      meta: 'BPM 150 ・ 44小節 ・ 約1分10秒 ・ 帯のねじれと穴の曲がりは奥まで見えるので、先読みできます。',
      theme, comboOwn: true, attractFromBar: 20,
      bpm: BPM, bars: 44, sections: SECTIONS, chords: CHORDS, chart: CHART,
      laneCodes: [['KeyD'], ['KeyF'], ['KeyJ'], ['KeyK']],
      // the direction of the tap from the centre picks the stripe that is there now
      touchLane(x, y, now) {
        const a = Math.atan2(y - C.y, x - C.x) / DEG;
        for (let l = 0; l < 4; l++) {
          const d = ((a - stripeAng(l, now)) % 360 + 540) % 360 - 180;
          if (Math.abs(d) <= 45) return l;
        }
        return -1;
      },
      progressColor: (beat) => rgba(STRIPES[SECTIONS[kit.secIndex(SECTIONS, Math.max(0, Math.floor(beat / 4)))].hue].rgb, 0.9),
      song: {
        bass: { wave: 'sawtooth', subShift: -12, q: 7, open: 1700, close: 260 },
        pad: { wave: 'sawtooth', cutoff: 1400, level: 0.045, detune: 12, attack: 0.25 },
        delay: { beats: 0.75, feedback: 0.3, mix: 0.22 }, leadLevel: 0.45, leadSend: 0.35, padBus: 0.8,
        leadMidi: (n) => CHORDS[Math.floor(n.beat / 4) % 4].lead[n.lane],
        // Supersaw stab: three detuned saws through a filter that snaps shut.
        lead(A, at, midi, dur) {
          const { ac } = A, f0 = A.mtof(midi);
          const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 3;
          f.frequency.setValueAtTime(5200, at); f.frequency.exponentialRampToValueAtTime(1100, at + 0.18);
          const gn = ac.createGain();
          gn.gain.setValueAtTime(0.0001, at); gn.gain.exponentialRampToValueAtTime(0.13, at + 0.004);
          if (dur < 0.3) gn.gain.exponentialRampToValueAtTime(0.0001, at + 0.3);
          else { gn.gain.exponentialRampToValueAtTime(0.06, at + 0.15); gn.gain.setValueAtTime(0.06, at + dur); gn.gain.exponentialRampToValueAtTime(0.0001, at + dur + 0.25); }
          f.connect(gn).connect(A.bus.lead);
          const end = at + Math.max(0.35, dur + 0.3);
          for (const det of [-14, 0, 14]) {
            const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f0; o.detune.value = det;
            o.connect(f); o.start(at); o.stop(end);
          }
        },
        arrange(add, bar, b0, ch, name) {
          if (name === 'INTRO') {
            if (bar >= 2) for (let i = 0; i < 8; i++) add(b0 + i / 2, 'hat', false);
          } else if (name === 'VERSE') {
            for (let i = 0; i < 4; i++) { add(b0 + i, 'kick'); add(b0 + i + 0.5, 'hat', false); add(b0 + i + 0.5, 'bass', ch.bass, SPB * 0.45); }
          } else if (name === 'BUILD') {
            for (let i = 0; i < 4; i++) { add(b0 + i, 'kick'); add(b0 + i + 0.5, 'bass', ch.bass, SPB * 0.45); }
            for (let i = 0; i < 16; i++) add(b0 + i / 4, 'hat', false);
            if (bar === 19) for (let i = 8; i < 16; i++) add(b0 + i / 4, 'snare');
            else { add(b0 + 1, 'snare'); add(b0 + 3, 'snare'); }
          } else if (name === 'CHORUS' || name === 'CHORUS II') {
            if (bar % 4 === 0) add(b0, 'crash');
            for (let i = 0; i < 4; i++) {
              add(b0 + i, 'kick');
              add(b0 + i + 0.25, 'bass', ch.bass, SPB * 0.2); add(b0 + i + 0.5, 'bass', ch.bass + 12, SPB * 0.2); add(b0 + i + 0.75, 'bass', ch.bass, SPB * 0.2);
              add(b0 + i + 0.5, 'hat', true);
            }
            add(b0 + 1, 'snare'); add(b0 + 3, 'snare');
          } else if (name === 'BREAK') {
            add(b0, 'bass', ch.bass, SPB * 3.5);
            for (let i = 0; i < 4; i++) add(b0 + i + 0.5, 'hat', false);
            if (bar === 31) { for (let i = 0; i < 4; i++) add(b0 + i, 'kick'); for (let i = 8; i < 16; i++) add(b0 + i / 4, 'snare'); }
          } else if (name === 'OUTRO') {
            if (bar === 40) add(b0, 'crash');
            if (bar <= 41) { add(b0, 'kick'); add(b0 + 2, 'kick'); }
            if (bar === 42) add(b0, 'bass', ch.bass, SPB * 4);
          }
        },
      },
      layout(w, h, snap) {
        W = w; H = h;
        let x0 = 0;
        if (kit.wide()) x0 = Math.max(W * 0.42, 560);
        const aw = W - x0;
        CG.x = x0 + aw / 2; CG.y = H * 0.52;
        CG.r = Math.min(aw * 0.46, H * 0.44);
        if (snap) Object.assign(C, CG);
      },
      update(now, dt) {
        VIEW = kit.view(1.2);
        const k = Math.min(1, dt * 4);
        for (const key of ['x', 'y', 'r']) C[key] += (CG[key] - C[key]) * k;
      },
      draw(now, dt) {
        const beat = now / SPB;
        const pulse = kit.pulse(beat, kickBar(Math.floor(beat / 4)));
        drawShaft(now, dt, pulse);
        if (kit.playing()) drawCentre(now);
        drawNotes(now);
        drawRim(now);
        drawEffects(dt);
      },
      onJudge(n, grade, now) {
        if (grade === 'miss') return;
        const a = stripeAng(n.lane, now) * DEG;
        burst(C.x + Math.cos(a) * C.r, C.y + Math.sin(a) * C.r, STRIPES[n.lane].rgb, grade === 'perfect' ? 1 : 0.6);
        flashes.push({ lane: n.lane, t: now, life: 0 });
        S.flash[n.lane] = 1;
      },
      onNewRun() { particles.length = 0; flashes.length = 0; },
    };
  });

  // =====================================================================
  //  BOOT
  // =====================================================================
  window.addEventListener('resize', resize);
  syncUi();
  resize();
  renderMenu();
  const fromHash = MODES.find((m) => `#${m.id}` === location.hash);
  M = fromHash || MODES[0];
  applyTheme(M);
  if (fromHash) showTitle(fromHash); else showMenu();
  // a link like …#kiriko opens that mode's title, also when the page is already open
  window.addEventListener('hashchange', () => {
    const m = MODES.find((x) => `#${x.id}` === location.hash);
    if (m && S.screen !== 'play') showTitle(m);
  });
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.load) document.fonts.load('20px "Dela Gothic One"').catch(() => {});
  // test hook
  window.__lab = { S, MODES, get mode() { return M; }, showTitle, startGame, showMenu };
})();
</script>
